name: Fix Markdown JSDoc

on:
  push:
    branches:
      - feature/canonical-render-api-work

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-api-work
          fetch-depth: 0

      - name: Apply exact source repair
        run: node scripts/fix-markdown-jsdoc.mjs

      - name: Commit repair and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/fix-markdown-jsdoc.mjs
          rm .github/workflows/fix-markdown-jsdoc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: repair Markdown projection JSDoc"
          git push origin HEAD:feature/canonical-render-api-work
