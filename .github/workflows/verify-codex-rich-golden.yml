name: Verify Codex rich golden evidence

on:
  push:
    paths:
      - 'tests/fixtures/codex/codex-rich.jsonl'
      - '.github/workflows/verify-codex-rich-golden.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current AI transcript source
        run: git clone --depth 1 https://github.com/Ma-XX-oN/AI-General-Memory.git /tmp/ai-general-memory
      - name: Install renderer dependencies
        run: python -m pip install colorama regex
      - name: Render plain Codex evidence
        run: python /tmp/ai-general-memory/scripts/AI-transcript.py --codex --file tests/fixtures/codex/codex-rich.jsonl --color=never > codex-rich.plain.md
      - name: Render decorated Codex evidence
        run: python /tmp/ai-general-memory/scripts/AI-transcript.py --codex --file tests/fixtures/codex/codex-rich.jsonl -dn --color=always > codex-rich.decorated.md
      - name: Record source provenance
        run: |
          git -C /tmp/ai-general-memory rev-parse HEAD > ai-transcript-source-commit.txt
          git -C /tmp/ai-general-memory hash-object scripts/AI-transcript.py > ai-transcript-script-blob.txt
          sha256sum tests/fixtures/codex/codex-rich.jsonl codex-rich.plain.md codex-rich.decorated.md > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codex-rich-render-evidence
          path: |
            codex-rich.plain.md
            codex-rich.decorated.md
            ai-transcript-source-commit.txt
            ai-transcript-script-blob.txt
            sha256sums.txt
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/verify-codex-rich-golden.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'chore: remove temporary Codex rich verification workflow'
          git push
