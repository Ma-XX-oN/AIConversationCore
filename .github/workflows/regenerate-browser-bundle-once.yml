name: Regenerate browser bundle once

on:
  push:
    paths:
      - .github/workflows/regenerate-browser-bundle-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate committed browser bundle
        run: npm run build:browser
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- dist/aiconversationcore.chatgpt.browser.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/aiconversationcore.chatgpt.browser.js
          git commit -m "build: regenerate ChatGPT browser bundle"
          git push
