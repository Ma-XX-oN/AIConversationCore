name: Issue 84 documentation

on:
  push:
    branches:
      - issue-84-unmatched-raw-blockquote-regression
    paths:
      - '.github/workflows/issue-84-docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record rendering contract and decision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rendering = Path('RENDERING.md')
          text = rendering.read_text(encoding='utf-8')
          needle = (
              'Fenced Markdown code becomes a code block. Fence contents are not recursively\n'
              'interpreted as Markdown/HTML; they are escaped and may be syntax-highlighted or\n'
              'otherwise prettified by the output renderer.\n'
          )
          addition = needle + (
              '\nRaw HTML syntax originating from textual Markdown leaves is transcript content,\n'
              'not permission to mutate Core-owned presentation structure. Canonical HTML\n'
              'therefore escapes Markdown raw-HTML tokens before they enter the structural DOM.\n'
              'Only HTML generated by the Core presentation renderer participates as canonical\n'
              'structure. The escaped source characters remain visible canonical content and\n'
              'participate in the same Core-owned word identity stream.\n'
          )
          if needle not in text:
              raise SystemExit('RENDERING.md insertion point not found')
          rendering.write_text(text.replace(needle, addition, 1), encoding='utf-8')

          decisions = Path('DECISIONS.md')
          dtext = decisions.read_text(encoding='utf-8')
          if '## D025 — Raw Markdown HTML is content, not Core structure' in dtext:
              raise SystemExit('D025 already exists')
          dtext = dtext.rstrip() + '''\n\n## D025 — Raw Markdown HTML is content, not Core structure\n\n**Status:** Accepted\n\n**Decision:** Raw HTML syntax that originates inside a canonical textual Markdown\nleaf is transcript content. The canonical HTML renderer escapes Marked raw-HTML\ntokens before inserting the rendered leaf into Core-owned presentation containers.\nOnly structural HTML emitted by Core itself may participate in the canonical DOM.\nThe escaped source characters remain visible content and retain ordinary canonical\nword identity. Fenced code continues to use the existing code-block escaping rule.\n\nCore's structural parsers remain strict. They must not recover from mis-nested or\nunbalanced HTML by silently popping ancestors, and consumers must not add fallback\nrepair paths for malformed canonical HTML.\n\n**Reason:** Real-machine AgentPanelSpeaker testing exposed a Codex transcript that\nmade raw Markdown HTML survive Marked and reach Core's word-element restructuring\npass, where it failed with `Canonical HTML closes unexpected <blockquote>.` Raw\ntranscript text must never be able to close or reparent Core's own turn, reasoning,\ntool, or other semantic containers. Escaping at the Markdown-leaf boundary keeps\nsource text visible while preserving D017's rule that Core alone owns presentation\nstructure and D019's one canonical word-identity path.\n'''
          decisions.write_text(dtext, encoding='utf-8')
          PY
          git diff --check
          grep -F 'Raw HTML syntax originating from textual Markdown leaves is transcript content' RENDERING.md
          grep -F '## D025 — Raw Markdown HTML is content, not Core structure' DECISIONS.md
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RENDERING.md DECISIONS.md
          git commit -m 'docs: define raw Markdown HTML boundary (#84)'
          git push origin HEAD:issue-84-unmatched-raw-blockquote-regression
