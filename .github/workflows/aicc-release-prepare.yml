name: AICC temporary release preparation

on:
  push:
    paths:
      - '.ci/aicc-release-prepare'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aicc-release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/heads/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read requested version (ignore # retry comment)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/aicc-release-prepare
          line="$(head -n 1 .ci/aicc-release-prepare)"
          version="${line%%#*}"
          version="$(printf '%s' "$version" | xargs)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure commit identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare release on issue branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run release:prepare -- "${{ steps.version.outputs.version }}"
