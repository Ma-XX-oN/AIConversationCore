name: Issue 89 bare Turn ID migration

on:
  push:
    branches:
      - issue-89-turn-id-without-prefix

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund
      - name: Apply issue 89 production migration
        shell: bash
        run: python scripts/apply-issue89.py
      - name: Build browser bundle
        shell: bash
        run: node scripts/build-browser-bundle.mjs
      - name: Check production JSDoc coverage
        shell: bash
        run: node scripts/check-jsdoc.mjs
      - name: Run Core tests
        shell: bash
        run: npm test
      - name: Run integrity gates
        shell: bash
        run: |
          python tests/validate-phase2-baseline.py
          python tests/validate-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
          python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        shell: bash
        run: git diff --check
      - name: Commit verified production change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/projections/markdown.js src/projections/heading-metadata.js src/projections/turn-header.js tests/core-heading-metadata.test.js tests/heading-metadata-projection.test.js tests/turn-header.test.js tests/turn-id-display.test.js RENDERING.md DECISIONS.md dist/aiconversationcore.chatgpt.browser.js
          git commit -m 'projection: render bare visible Turn IDs (#89)'
          git push
