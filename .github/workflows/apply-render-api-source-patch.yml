name: Apply render API source patch

on:
  push:
    branches:
      - feature/canonical-render-api-work

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-api-work
          fetch-depth: 0

      - name: Apply documentation repairs and remove temporary patching
        shell: bash
        run: |
          set -euo pipefail

          if git apply --check scripts/fix-legacy-markdown-jsdoc.patch; then
            git apply scripts/fix-legacy-markdown-jsdoc.patch
          fi

          python - <<'PY'
          from pathlib import Path

          session = Path('src/adapters/session.js')
          text = session.read_text(encoding='utf-8')
          old = ' * @returns {{generated_context:string,user_text:string}} Structured queue text.'
          new = ' * @returns {Object<string, string>} Generated-context and user-text fields for the queued command.'
          if old not in text:
            raise SystemExit('Expected queued-command JSDoc line was not found.')
          session.write_text(text.replace(old, new, 1), encoding='utf-8')

          checker = Path('scripts/check-jsdoc.mjs')
          text = checker.read_text(encoding='utf-8')
          start = text.find('// Exact documentation failures already present on main before the canonical render API work began.')
          end_marker = ']);\n\nfor (const root of roots) {'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('Expected temporary legacy-failure allowlist was not found.')
          text = text[:start] + 'for (const root of roots) {' + text[end + len(end_marker):]
          text = text.replace(
            'const actionableFailures = failures.filter(failure => !legacyFailures.has(failure));',
            'const actionableFailures = failures;'
          )
          warning = "if (failures.length) {\n  console.warn('Known pre-existing documentation debt:\\n' + failures.join('\\n'));\n}\n"
          text = text.replace(warning, '')
          checker.write_text(text, encoding='utf-8')
          PY

          rm -f scripts/fix-legacy-markdown-jsdoc.patch
          rm -f .github/workflows/apply-render-api-source-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: repair projection documentation contract"
          git push origin HEAD:feature/canonical-render-api-work
