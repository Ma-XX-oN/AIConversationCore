name: Issue 102 regenerate integrated browser bundle once

on:
  push:
    branches:
      - issue-102-scripted-release-tags
    paths:
      - .github/workflows/issue-102-regenerate-bundle-once.yml

permissions:
  contents: write

jobs:
  regenerate-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate deterministic browser artifact
        run: npm run build:browser

      - name: Verify full Core Node suite
        run: npm test

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit regenerated artifact and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/aiconversationcore.chatgpt.browser.js
          git rm .github/workflows/issue-102-regenerate-bundle-once.yml
          git diff --cached --exit-code --quiet && {
            echo "Expected regenerated artifact/workflow removal changes were not produced."
            exit 1
          }
          git commit -m "build(#102): regenerate browser bundle after Core-line integration"
          git push origin HEAD:issue-102-scripted-release-tags
