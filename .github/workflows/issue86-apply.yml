name: Apply issue 86 Core-owned heading metadata

on:
  push:
    branches:
      - issue-86-response-heading-metadata
    paths:
      - 'scripts/issue86-apply.py'
      - '.github/workflows/issue86-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct JavaScript escape matching in apply helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/issue86-apply.py')
          text = path.read_text(encoding='utf-8')
          old = '  """  const headingEvent = segment[0];'
          new = '  r"""  const headingEvent = segment[0];'
          count = text.count(old)
          if count != 2:
            raise SystemExit(f'expected two response-heading literals, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply implementation patch
        run: python scripts/issue86-apply.py
      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Commit implementation and remove apply scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue86-apply.yml scripts/issue86-apply.py
          git add src/adapters/chatgpt-base.js src/adapters/claude.js src/adapters/codex.js src/projections/markdown.js src/projections/html.js dist/aiconversationcore.chatgpt.browser.js
          git diff --check
          git commit -m 'projection: make heading semantics Core-owned (#86)'
          git push
