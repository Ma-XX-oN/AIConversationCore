name: Apply issue 86 Core-owned heading metadata

on:
  push:
    branches:
      - issue-86-response-heading-metadata
    paths:
      - 'scripts/issue86-apply.py'
      - 'scripts/issue86-bundle-apply.py'
      - '.github/workflows/issue86-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Correct temporary apply helpers for current branch state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/issue86-apply.py')
          text = path.read_text(encoding='utf-8')
          old = '  """  const headingEvent = segment[0];'
          new = '  r"""  const headingEvent = segment[0];'
          count = text.count(old)
          if count != 2:
            raise SystemExit(f'expected two response-heading literals, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('scripts/issue86-bundle-apply.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Public HTML must carry the same heading projection options as Markdown.')
          end = text.index('# Keep the classic browser bundle on the same public projection chain as ESM.')
          text = text[:start] + text[end:]
          replacements = [
            ('  """    `// - src/projections/markdown.js', '  r"""    `// - src/projections/markdown.js', 1),
            ('  """    `// - src/projections/style.js', '  r"""    `// - src/projections/style.js', 1),
            ('  """    `${turns}', '  r"""    `${turns}', 2),
          ]
          for old, new, expected in replacements:
            count = text.count(old)
            if count != expected:
              raise SystemExit(f'expected {expected} raw-string marker(s) for {old!r}, found {count}')
            text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply implementation patches
        run: |
          python scripts/issue86-apply.py
          python scripts/issue86-bundle-apply.py
      - name: Rebuild browser bundle
        run: npm run build:browser
      - name: Run full Core tests before commit
        run: npm test
      - name: Commit implementation and remove apply scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue86-apply.yml scripts/issue86-apply.py scripts/issue86-bundle-apply.py
          git add src/adapters/chatgpt-base.js src/adapters/claude.js src/adapters/codex.js src/projections/markdown.js src/projections/html.js scripts/build-browser-bundle.mjs dist/aiconversationcore.chatgpt.browser.js
          git diff --check
          git commit -m 'projection: make heading semantics Core-owned (#86)'
          git push
