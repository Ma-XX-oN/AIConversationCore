name: Issue 72 structural speech prefix RED

on:
  push:
    branches:
      - issue-72-speech-prefix-word-identity
    paths:
      - '.github/workflows/issue-72-speech-prefix-red.yml'
      - 'tests/canonical-word-speech-prefix.test.js'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify exact structural-prefix RED
        shell: bash
        run: |
          set +e
          output="$(node --test tests/canonical-word-speech-prefix.test.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "undefined !== '3. '" <<<"$output"
          grep -F "undefined !== ''" <<<"$output"
          grep -F "# tests 4" <<<"$output"
          grep -F "# fail 4" <<<"$output"
