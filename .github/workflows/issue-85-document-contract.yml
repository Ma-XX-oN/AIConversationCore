name: Issue 85 design-contract validation

on:
  push:
    branches:
      - issue-85-navigation-boundaries

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: issue-85-navigation-boundaries
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Document navigation-boundary contract
        run: python tools/issue85-document-contract.py

      - name: Verify browser bundle and complete Core suite
        run: |
          node scripts/build-browser-bundle.mjs
          git diff --exit-code -- package-lock.json dist/aiconversationcore.chatgpt.browser.js
          node scripts/check-jsdoc.mjs
          npm test
          python tests/validate-phase2-baseline.py
          python tests/validate-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
          python tests/validate-provider-example-regressions.py
          git diff --check

      - name: Commit clean documented candidate
        shell: bash
        run: |
          git rm .github/workflows/issue-85-document-contract.yml tools/issue85-document-contract.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md
          git commit -m "docs: define canonical navigation boundaries"
          git push origin HEAD:issue-85-navigation-boundaries
