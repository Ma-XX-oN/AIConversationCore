name: Issue 79 implement canonical HTML units

on:
  push:
    branches:
      - issue-79-canonical-html-units
    paths:
      - '.github/workflows/issue-79-implementation.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-79-canonical-html-units
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply issue 79 production change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
            path = Path(path_name)
            text = path.read_text(encoding='utf-8')
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{path_name}: expected one replacement anchor, found {count}')
            path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
            'src/projections/presentation.js',
            """  if (contexts.length) {
            children.push(contentNode(event, 'user_context', contexts));
          }
          """,
            """  if (contexts.length) {
            children.push({
              ...contentNode(event, 'user_context', contexts),
              atomic: true
            });
          }
          """)

          replace_once(
            'src/projections/html.js',
            """/**
           * Renders complete canonical HTML directly from normalized canonical events.
           *
           * All semantic structure and Markdown-to-HTML conversion are owned by
           * AIConversationCore. Downstream consumers integrate this completed HTML rather
           * than interpreting presentation nodes or provider-specific markers.
           *
           * @param {Array<Object<string, *>>} events - Ordered normalized canonical events.
           * @returns {string} Complete canonical HTML transcript.
           */
          export function renderCanonicalHtml(events) {
            if (!Array.isArray(events)) throw new TypeError('Canonical events must be an array.');
            const presentation = buildCanonicalPresentation(events);
            const emittedSourceIndexes = new Set();
            return (presentation.turns ?? [])
              .map(turn => renderTurn(turn, emittedSourceIndexes))
              .join('');
          }
          """,
            """/**
           * Renders ordered complete-turn HTML units from normalized canonical events.
           *
           * Each returned unit is a legal virtualization boundary owned by Core.  Its
           * HTML is already fully rendered canonical output, so downstream consumers may
           * materialize or concatenate whole units without rediscovering presentation
           * semantics from tags, classes, or source-anchor counts.
           *
           * @param {Array<Object<string, *>>} events - Ordered normalized canonical events.
           * @returns {Array<Object<string, *>>} Ordered indivisible canonical HTML units.
           */
          export function renderCanonicalHtmlUnits(events) {
            if (!Array.isArray(events)) throw new TypeError('Canonical events must be an array.');
            const presentation = buildCanonicalPresentation(events);
            const emittedSourceIndexes = new Set();
            return (presentation.turns ?? []).map(turn => ({
              id: turn?.id ?? '',
              kind: 'turn',
              atomic: true,
              source: (turn?.source ?? []).map(source => ({ ...source })),
              html: renderTurn(turn, emittedSourceIndexes)
            }));
          }

          /**
           * Renders complete canonical HTML directly from normalized canonical events.
           *
           * All semantic structure and Markdown-to-HTML conversion are owned by
           * AIConversationCore. The complete output is exactly the concatenation of the
           * same Core-owned complete-turn units exposed to interactive consumers.
           *
           * @param {Array<Object<string, *>>} events - Ordered normalized canonical events.
           * @returns {string} Complete canonical HTML transcript.
           */
          export function renderCanonicalHtml(events) {
            return renderCanonicalHtmlUnits(events)
              .map(unit => unit.html)
              .join('');
          }
          """)

          Path('src/projections/html-visibility.js').write_text("""import {
            renderCanonicalHtmlUnits as renderBaseHtmlUnits
          } from './html.js';
          import { buildCanonicalPresentation } from './presentation-revisions.js';
          import {
            isHistoricalRevision,
            projectRevisionVisibility
          } from './revision-visibility.js';

          /**
           * Resolves canonical revision metadata for one presentation turn.
           *
           * @param {Object<string, *>} turn - Canonical presentation turn.
           * @param {Map<string, Object<string, *>>} eventsById - Projected events by ID.
           * @returns {Object<string, *>} Revision and effective-visibility metadata.
           */
          function turnRevisionProjection(turn, eventsById) {
            const sourceEvents = (turn?.source ?? [])
              .map(source => eventsById.get(source?.event_id))
              .filter(Boolean);
            const revisionEvent = sourceEvents.find(event =>
              typeof event?.revision_status === 'string' && event.revision_status.length);
            const visible = sourceEvents.length === 0 ||
              sourceEvents.some(event => event?.projection?.visible !== false);
            return {
              visible,
              revision_status: revisionEvent?.revision_status ?? null,
              revision_depth: Number.isInteger(revisionEvent?.revision_depth)
                ? revisionEvent.revision_depth
                : null,
              historical: revisionEvent ? isHistoricalRevision(revisionEvent) : false
            };
          }

          /**
           * Applies canonical revision/visibility attributes to one already-rendered turn.
           *
           * This remains a Core serializer operation.  Interactive consumers receive the
           * completed unit and never need to interpret revision status or rewrite HTML.
           *
           * @param {string} html - Base canonical HTML for one complete turn.
           * @param {Map<string, Object<string, *>>} turnsById - Turn projection metadata.
           * @returns {string} Canonical turn HTML with revision visibility attributes.
           */
          function applyTurnRevisionAttributes(html, turnsById) {
            return html.replace(
              /<section class=\"transcript-turn\" data-presentation-id=\"([^\"]*)\">/,
              (match, id) => {
                const projection = turnsById.get(id);
                if (!projection) return match;
                const status = projection.revision_status;
                const className = status
                  ? `transcript-turn revision-${status}`
                  : 'transcript-turn';
                const statusAttribute = status
                  ? ` data-revision-status=\"${status}\"`
                  : '';
                const depthAttribute = Number.isInteger(projection.revision_depth)
                  ? ` data-revision-depth=\"${projection.revision_depth}\"`
                  : '';
                const hiddenAttribute = projection.historical && !projection.visible
                  ? ' hidden'
                  : '';
                return `<section class=\"${className}\" data-presentation-id=\"${id}\"` +
                  `${statusAttribute}${depthAttribute}${hiddenAttribute}>`;
              }
            );
          }

          /**
           * Renders canonical HTML as ordered complete-turn units while retaining
           * historical revision turns and their stable identities.
           *
           * @param {Array<Object<string, *>>} events - Complete canonical event inventory.
           * @param {Object<string, *>} options - Projection options.
           * @returns {Array<Object<string, *>>} Ordered canonical HTML units.
           */
          export function renderCanonicalHtmlUnits(events, options = {}) {
            if (!Array.isArray(events)) throw new TypeError('Canonical events must be an array.');
            const projectedEvents = projectRevisionVisibility(events, options);
            const presentation = buildCanonicalPresentation(projectedEvents);
            const eventsById = new Map(projectedEvents.map(event => [event?.id, event]));
            const turnsById = new Map((presentation.turns ?? []).map(turn => [
              String(turn?.id ?? ''),
              turnRevisionProjection(turn, eventsById)
            ]));

            return renderBaseHtmlUnits(projectedEvents).map(unit => ({
              ...unit,
              html: applyTurnRevisionAttributes(unit.html, turnsById)
            }));
          }

          /**
           * Renders canonical HTML while retaining historical revision turns in the DOM.
           *
           * Historical turns always remain serialized with stable presentation IDs and
           * semantic revision attributes.  The selected projection controls only their
           * `hidden` state, allowing an interactive consumer to show/hide the already
           * materialized DOM without reparsing provider records or changing identities.
           *
           * @param {Array<Object<string, *>>} events - Complete canonical event inventory.
           * @param {Object<string, *>} options - Projection options.
           * @returns {string} Canonical structural HTML containing all revision turns.
           */
          export function renderCanonicalHtml(events, options = {}) {
            return renderCanonicalHtmlUnits(events, options)
              .map(unit => unit.html)
              .join('');
          }
          """, encoding='utf-8')

          replace_once(
            'src/index.js',
            "export { renderCanonicalHtml } from './projections/html-visibility.js';\n",
            """export {
            renderCanonicalHtml,
            renderCanonicalHtmlUnits
          } from './projections/html-visibility.js';
          """)

          replace_once(
            'scripts/build-browser-bundle.mjs',
            """/**
           * Converts an ESM helper module with multiple named function exports into a
           * classic-script local-function body without copying the helper semantics into
           * the bundle generator itself.
           *
           * @param {string} text - Complete UTF-8 ESM module source.
           * @param {Array<string>} exportedFunctions - Named function exports to localize.
           * @returns {string} Rewritten local-function module body.
           */
          function multiExportModuleBody(text, exportedFunctions) {
            let result = text;
            for (const functionName of exportedFunctions) {
              result = replaceOnce(
                result,
                `export function ${functionName}`,
                `function ${functionName}`,
                `${functionName} export`
              );
            }
            return result.trim();
          }
          """,
            """/**
           * Converts an ESM helper module with multiple named function exports into a
           * classic-script local-function body without copying the helper semantics into
           * the bundle generator itself.
           *
           * @param {string} text - Complete UTF-8 ESM module source.
           * @param {Array<string>} exportedFunctions - Named function exports to localize.
           * @param {Array<string>} importLines - Exact ESM import lines to remove.
           * @returns {string} Rewritten local-function module body.
           */
          function multiExportModuleBody(text, exportedFunctions, importLines = []) {
            let result = text;
            for (const importLine of importLines) {
              result = replaceOnce(result, `${importLine}\n`, '', `module import ${importLine}`);
            }
            for (const functionName of exportedFunctions) {
              result = replaceOnce(
                result,
                `export function ${functionName}`,
                `function ${functionName}`,
                `${functionName} export`
              );
            }
            return result.trim();
          }
          """)

          replace_once(
            'scripts/build-browser-bundle.mjs',
            """  const html = moduleBody(htmlSource, {
            importLines: [
              \"import { marked } from 'marked';\",
              \"import { buildCanonicalPresentation } from './presentation-revisions.js';\"
            ],
            exportedFunction: 'renderCanonicalHtml',
            localFunction: 'renderCanonicalHtml'
          });
          """,
            """  const html = multiExportModuleBody(
            htmlSource,
            ['renderCanonicalHtmlUnits', 'renderCanonicalHtml'],
            [
              \"import { marked } from 'marked';\",
              \"import { buildCanonicalPresentation } from './presentation-revisions.js';\"
            ]
          );
          """)

          replace_once(
            'scripts/build-browser-bundle.mjs',
            """    `    renderCanonicalMarkdown,\\n` +
              `    renderCanonicalHtml,\\n` +
              `    buildCanonicalPresentation,\\n` +
          """,
            """    `    renderCanonicalMarkdown,\\n` +
              `    renderCanonicalHtml,\\n` +
              `    renderCanonicalHtmlUnits,\\n` +
              `    buildCanonicalPresentation,\\n` +
          """)

          replace_once(
            'tests/browser-bundle.test.js',
            """  adaptChatGPTRecords,
            renderCanonicalHtml,
            renderCanonicalMarkdown
          """,
            """  adaptChatGPTRecords,
            renderCanonicalHtml,
            renderCanonicalHtmlUnits,
            renderCanonicalMarkdown
          """)

          replace_once(
            'tests/browser-bundle.test.js',
            """  assert.equal(typeof context.AIConversationCore.renderCanonicalMarkdown, 'function');
            assert.equal(typeof context.AIConversationCore.renderCanonicalHtml, 'function');
          """,
            """  assert.equal(typeof context.AIConversationCore.renderCanonicalMarkdown, 'function');
            assert.equal(typeof context.AIConversationCore.renderCanonicalHtml, 'function');
            assert.equal(typeof context.AIConversationCore.renderCanonicalHtmlUnits, 'function');
          """)

          replace_once(
            'tests/browser-bundle.test.js',
            """  const actual = context.AIConversationCore.renderCanonicalHtml(plain(events));
            assert.equal(actual, expected);
            assert.match(actual, /<blockquote class=\"user-context\">/);
          """,
            """  const actual = context.AIConversationCore.renderCanonicalHtml(plain(events));
            const units = context.AIConversationCore.renderCanonicalHtmlUnits(plain(events));
            assert.equal(actual, expected);
            assert.equal(units.map(unit => unit.html).join(''), expected);
            assert.equal(units.length, 1);
            assert.equal(units[0].atomic, true);
            assert.equal(units[0].source[0].record_id, 'record:user-context:browser');
            assert.match(actual, /<blockquote class=\"user-context\">/);
          """)

          html_units_test = Path('tests/canonical-html-units.test.js')
          text = html_units_test.read_text(encoding='utf-8')
          if 'revision visibility is preserved identically in complete and unit HTML' not in text:
            text += """

          test('revision visibility is preserved identically in complete and unit HTML', () => {
            const historical = {
              ...USER_CONTEXT_EVENT,
              id: 'event:user-context:historical',
              source_record_id: 'record:user-context:historical',
              revision_status: 'original',
              revision_depth: 0,
              rolled_back: true
            };
            const units = core.renderCanonicalHtmlUnits([historical], {
              includeRolledBackTurns: false
            });
            const html = core.renderCanonicalHtml([historical], {
              includeRolledBackTurns: false
            });

            assert.equal(units.length, 1);
            assert.equal(units[0].html, html);
            assert.match(units[0].html, /class=\"transcript-turn revision-original\"/);
            assert.match(units[0].html, /data-revision-status=\"original\"/);
            assert.match(units[0].html, /data-revision-depth=\"0\"/);
            assert.match(units[0].html, / hidden>/);
          });

          test('equivalent provider turns use the same complete-unit boundary policy', () => {
            for (const provider of ['chatgpt', 'claude', 'codex']) {
              const event = {
                ...USER_CONTEXT_EVENT,
                id: `event:user-context:${provider}`,
                provider,
                source_record_id: `record:user-context:${provider}`
              };
              const units = core.renderCanonicalHtmlUnits([event]);
              assert.equal(units.length, 1, provider);
              assert.equal(units[0].kind, 'turn', provider);
              assert.equal(units[0].atomic, true, provider);
              assert.equal(units[0].source[0].provider, provider);
              assert.match(units[0].html, /<details class=\"user-context-details\"/);
            }
          });

          test('subagent presentation is returned as one complete Core unit', () => {
            const event = {
              id: 'event:subagent:1',
              provider: 'claude',
              kind: 'subagent',
              role: 'assistant',
              channel: 'final',
              content_type: 'subagent',
              visibility: 'visible',
              source_record_id: 'record:subagent:1',
              source_index: 0,
              blocks: [{
                type: 'subagent',
                agent_id: 'worker-1',
                output: 'Subagent result.'
              }]
            };
            const units = core.renderCanonicalHtmlUnits([event]);
            assert.equal(units.length, 1);
            assert.equal(units[0].atomic, true);
            assert.equal(units[0].source[0].record_id, 'record:subagent:1');
            assert.match(units[0].html, /<h2>Claude Sub-agent worker-1<\\/h2>/);
            assert.match(units[0].html, /Subagent result\./);
          });
          """
            html_units_test.write_text(text, encoding='utf-8')

          decisions = Path('DECISIONS.md')
          text = decisions.read_text(encoding='utf-8')
          if '## D018 — Canonical HTML exposes Core-owned complete virtualization units' not in text:
            text += """

          ## D018 — Canonical HTML exposes Core-owned complete virtualization units

          **Status:** Accepted

          **Decision:** Interactive consumers that virtualize canonical HTML use
          Core-rendered complete HTML units.  The initial legal cut is one complete
          presentation turn per unit.  Each unit carries its stable presentation ID,
          source-record identities, an explicit atomic contract, and already-rendered
          canonical HTML.

          `renderCanonicalHtmlUnits()` and `renderCanonicalHtml()` use the same Core HTML
          serializer.  Concatenating unit HTML in canonical order must reproduce the
          complete canonical HTML exactly.  User Context, reasoning groups, tools, and
          other nested semantic containers remain entirely inside a returned unit; a
          consumer must not split a unit or infer a finer boundary from `<details>`, CSS
          classes, record-anchor counts, or provider markers.

          The presentation tree continues to expose nested atomic semantics.  The
          complete-turn unit boundary is deliberately conservative and does not claim
          that turns are inherently indivisible at every future projection level.  A
          future finer-grained virtualization API must be defined and rendered by Core
          with an explicit versioned contract before consumers may cut more finely.

          **Reason:** AgentPanelSpeaker demonstrated that slicing completed HTML around
          source anchors can bisect a semantically atomic disclosure even when all source
          identities are retained.  Moving `<details>` inference into the consumer would
          recreate Core presentation semantics downstream and violate D017.  Core-owned
          rendered units preserve one HTML renderer while giving interactive consumers a
          safe virtualization boundary.
          """
            decisions.write_text(text, encoding='utf-8')

          rendering = Path('RENDERING.md')
          text = rendering.read_text(encoding='utf-8')
          marker = '## Output projections\n'
          section = """## Canonical HTML virtualization units

          `renderCanonicalHtmlUnits()` exposes ordered, already-rendered canonical HTML
          units for interactive consumers.  The current legal boundary is one complete
          presentation turn per unit.  Unit metadata carries stable presentation/source
          identity and declares the returned unit atomic for virtualization.

          Consumers may choose which complete units to materialize, concatenate adjacent
          units, and apply UI-specific virtualization/layout.  They must not split a unit
          or infer a finer semantic boundary from HTML tags, CSS classes, source-anchor
          counts, or provider-native markers.  Nested User Context, reasoning, tool, and
          interaction containers therefore remain Core-owned DOM subtrees.

          `renderCanonicalHtml()` is the concatenation of those same units in canonical
          order.  Unit rendering is not a third semantic rendering path; it is an
          interactive projection of the canonical HTML serializer.  Any future finer
          legal cut must be explicitly defined by Core rather than discovered by a
          caller.

          """
          if section not in text:
            if text.count(marker) != 1:
              raise SystemExit('RENDERING.md output-projections marker mismatch')
            rendering.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

          design = Path('DESIGN.md')
          text = design.read_text(encoding='utf-8')
          marker = '## Consumer boundaries\n'
          section = """## Canonical HTML units for interactive virtualization

          Canonical HTML has an interactive unit projection in addition to the complete
          string form.  Core renders both through the same HTML serializer.  The initial
          unit policy returns complete presentation turns with stable source identity and
          an indivisible virtualization contract.  This gives browser/WebView consumers a
          safe materialization boundary without exposing provider semantics or requiring
          them to parse canonical HTML to reconstruct grouping.

          A consumer owns viewport selection, spacers, measurement, scrolling, and DOM
          lifecycle.  Core owns which rendered semantic subtree may be separated from
          another.  Finer-grained cuts are an explicit future Core API/schema change, not
          a consumer heuristic.

          """
          if section not in text:
            if text.count(marker) != 1:
              raise SystemExit('DESIGN.md consumer-boundaries marker mismatch')
            design.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          marker = """AgentPanelSpeaker currently has independent provider interpretation in its speech
          extractor and Markdown formatter. Migration must converge those projections on one
          canonical normalization path rather than retaining both parsers behind the new
          core.
          """
          addition = marker + """

          The Phase 8 HTML virtualization boundary is tracked by #79.  Core exposes
          complete rendered turn units as the initial legal materialization boundary so
          AgentPanelSpeaker can virtualize without reparsing `<details>` ownership or
          source-anchor grouping.  Viewport/window mechanics remain in AgentPanelSpeaker.
          """
          if 'The Phase 8 HTML virtualization boundary is tracked by #79.' not in text:
            if text.count(marker) != 1:
              raise SystemExit('ROADMAP.md Phase 8 marker mismatch')
            roadmap.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs

      - name: Run issue 79 regression directly
        run: node --test tests/canonical-html-units.test.js

      - name: Run full Core tests
        run: npm test

      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py

      - name: Validate canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py

      - name: Validate canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py

      - name: Validate canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py

      - name: Validate provider example regressions
        run: python tests/validate-provider-example-regressions.py

      - name: Validate browser bundle is deterministic
        shell: bash
        run: |
          cp dist/aiconversationcore.chatgpt.browser.js "$RUNNER_TEMP/bundle.js"
          node scripts/build-browser-bundle.mjs
          cmp "$RUNNER_TEMP/bundle.js" dist/aiconversationcore.chatgpt.browser.js

      - name: Validate whitespace and patch integrity
        run: git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add src/projections/presentation.js src/projections/html.js \
            src/projections/html-visibility.js src/index.js \
            scripts/build-browser-bundle.mjs dist/aiconversationcore.chatgpt.browser.js \
            tests/canonical-html-units.test.js tests/browser-bundle.test.js \
            DECISIONS.md DESIGN.md RENDERING.md ROADMAP.md
          git diff --cached --check
          git commit -m 'feat: expose canonical HTML virtualization units (#79)'
          git push origin HEAD:issue-79-canonical-html-units
