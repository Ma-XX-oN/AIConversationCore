name: Regenerate browser bundle

on:
  push:
    branches:
      - feature/canonical-render-api-work

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-api-work
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate deterministic browser artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run build:browser
          rm .github/workflows/regenerate-browser-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "browser: regenerate canonical render bundle"
          git push origin HEAD:feature/canonical-render-api-work
