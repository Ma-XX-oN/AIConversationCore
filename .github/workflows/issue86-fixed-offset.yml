name: Apply issue 86 fixed-offset heading timezone support

on:
  push:
    branches:
      - issue-86-response-heading-metadata
    paths:
      - '.github/workflows/issue86-fixed-offset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply fixed-offset timezone support and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/projections/heading-metadata.js')
          text = source.read_text(encoding='utf-8')
          old = """export function formatHeadingTimestamp(raw, timeZone = null) {
  const date = sourceDate(raw);
  if (!date) return null;
  const formatter = new Intl.DateTimeFormat('en-CA', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23',
    ...(timeZone ? { timeZone } : {})
  });
"""
          new = """export function formatHeadingTimestamp(raw, timeZone = null) {
  const date = sourceDate(raw);
  if (!date) return null;
  const offsetMatch = typeof timeZone === 'string'
    ? timeZone.match(/^([+-])(\\d{2}):(\\d{2})$/)
    : null;
  if (offsetMatch) {
    const hours = Number(offsetMatch[2]);
    const minutes = Number(offsetMatch[3]);
    if (hours > 23 || minutes > 59) {
      throw new RangeError(`Invalid fixed-offset timezone: ${timeZone}`);
    }
    const sign = offsetMatch[1] === '-' ? -1 : 1;
    const offsetMinutes = sign * ((hours * 60) + minutes);
    const shifted = new Date(date.getTime() + (offsetMinutes * 60_000));
    return shifted.toISOString().slice(0, 19).replace('T', ' ');
  }
  const formatter = new Intl.DateTimeFormat('en-CA', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23',
    ...(timeZone ? { timeZone } : {})
  });
"""
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'expected one heading timestamp formatter body, found {count}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/heading-metadata-projection.test.js')
          text = test.read_text(encoding='utf-8')
          marker = """test('caller semantic heading metadata cannot override Core source provenance', () => {
"""
          addition = """test('Core-derived timestamp supports fixed-offset presentation timezones', () => {
  const event = messageEvent('chatgpt', 'fixed-offset-message', {}, {
    timestamp: '2026-08-31T15:00:00Z'
  });
  assert.match(
    renderCanonicalMarkdown([event], {
      heading: { timestamp: true, timeZone: '-04:00' }
    }),
    /^## User \\[2026-08-31 11:00:00\\]:$/m
  );
  assert.match(
    renderCanonicalMarkdown([event], {
      heading: { timestamp: true, timeZone: '+05:30' }
    }),
    /^## User \\[2026-08-31 20:30:00\\]:$/m
  );
});

"""
          count = text.count(marker)
          if count != 1:
            raise SystemExit(f'expected one insertion marker, found {count}')
          test.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY
      - name: Rebuild browser bundle
        run: npm run build:browser
      - name: Run full Core tests
        run: npm test
      - name: Check patch integrity
        run: git diff --check
      - name: Commit production change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue86-fixed-offset.yml
          git add src/projections/heading-metadata.js tests/heading-metadata-projection.test.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m 'projection: preserve fixed-offset heading timezones (#86)'
          git push
