name: Apply issue 86 fixed-offset heading timezone support

on:
  push:
    branches:
      - issue-86-response-heading-metadata
    paths:
      - '.github/workflows/issue86-fixed-offset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply fixed-offset timezone support and regression
        run: python scripts/issue86-fixed-offset.py
      - name: Rebuild browser bundle
        run: npm run build:browser
      - name: Run full Core tests
        run: npm test
      - name: Check patch integrity
        run: git diff --check
      - name: Commit production change and remove temporary scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue86-fixed-offset.yml scripts/issue86-fixed-offset.py
          git add src/projections/heading-metadata.js tests/heading-metadata-projection.test.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m 'projection: preserve fixed-offset heading timezones (#86)'
          git push
