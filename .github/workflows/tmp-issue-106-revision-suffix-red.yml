name: Temporary #106 revision-suffix RED

on:
  push:
    branches:
      - tmp/issue-106-revision-suffix-red

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable RED candidate
        uses: actions/checkout@v4
        with:
          ref: 26402656eb87f8b7991520b7e7935d6b9255df2f
          fetch-depth: 0

      - name: Assert immutable RED candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "26402656eb87f8b7991520b7e7935d6b9255df2f"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused revision-heading regression
        run: node --test tests/codex-revision-heading-metadata.test.js
