name: Codex fallback title red gate

on:
  push:
    paths:
      - .github/workflows/codex-fallback-title-red.yml

permissions:
  contents: read

jobs:
  red-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/codex-source-contract.test.js
