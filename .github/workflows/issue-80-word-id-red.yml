name: Issue 80 canonical word identity RED

on:
  push:
    branches:
      - issue-80-canonical-word-ids
    paths:
      - '.github/workflows/issue-80-word-id-red.yml'
      - 'tests/canonical-word-ids.test.js'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Confirm exact RED
        shell: bash
        run: |
          set +e
          output=$(node --test tests/canonical-word-ids.test.js 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo 'Canonical single-word-element regression unexpectedly passed before implementation.' >&2
            exit 1
          fi
          if ! grep -Eq 'Inline Markdown must render one canonical DOM word element|Core must restructure inline markup around one canonical DOM word element' <<<"$output"; then
            echo 'Expected canonical single-word-element RED was not observed.' >&2
            exit 1
          fi
          echo 'CONFIRMED RED: Core still fragments one canonical word across multiple DOM elements.'
