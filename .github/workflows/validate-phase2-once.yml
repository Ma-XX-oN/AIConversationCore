name: Validate Phase 2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-phase2-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Phase 2 baseline gate
        run: python tests/validate-phase2-baseline.py

      - name: Remove temporary validation workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          if [[ -f .github/workflows/validate-phase2-once.yml ]]; then
            git rm .github/workflows/validate-phase2-once.yml
            git commit -m 'Remove temporary Phase 2 validation workflow [skip ci]'
            git push origin main
          fi
