name: Fix ChatGPT tool payload fences once

on:
  push:
    paths:
      - .github/workflows/fix-chatgpt-tool-fences-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch ChatGPT tool fencing
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/projections/markdown.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          call_matches = [
              i for i, line in enumerate(lines)
              if "return details(`${block.name ?? 'tool'} code`" in line
          ]
          result_matches = [
              i for i, line in enumerate(lines)
              if "return details(`${block.name ?? 'tool'} output`" in line
          ]
          assert len(call_matches) == 1, call_matches
          assert len(result_matches) == 1, result_matches
          lines[call_matches[0]] = (
              "    return details(`${block.name ?? 'tool'} code`, "
              "fencedCode(block.input ?? '', language));"
          )
          lines[result_matches[0]] = (
              "    return details(`${block.name ?? 'tool'} output`, fencedCode(output));"
          )
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Build and verify
        run: |
          node scripts/build-browser-bundle.mjs
          npm test
          python tests/validate-phase2-baseline.py
          python tests/validate-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
          python tests/validate-provider-example-regressions.py
          grep -Fq "fencedCode(block.input ?? '', language)" src/projections/markdown.js
          grep -Fq 'fencedCode(output)' src/projections/markdown.js
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m "fix: contain ChatGPT tool payload Markdown"
          git push
