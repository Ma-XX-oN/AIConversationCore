name: Verify initial Phase 3 ChatGPT adapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-initial-adapter.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run core tests
        run: npm test
      - name: Re-run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          if [[ -f .github/workflows/phase3-initial-adapter.yml ]]; then
            git rm .github/workflows/phase3-initial-adapter.yml
            git commit -m 'Remove temporary Phase 3 verification workflow [skip ci]'
            git push origin main
          fi
