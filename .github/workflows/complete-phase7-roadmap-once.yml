name: Complete Phase 7 roadmap once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete-phase7-roadmap.py'
      - '.github/workflows/complete-phase7-roadmap-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded roadmap patch
        run: python scripts/complete-phase7-roadmap.py
      - name: Core test suite
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified roadmap completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'phase7: mark cross-consumer parity complete'
          git push origin HEAD:main
