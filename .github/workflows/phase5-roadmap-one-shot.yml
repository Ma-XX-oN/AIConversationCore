name: Phase 5 roadmap one-shot

on:
  push:
    paths:
      - '.github/workflows/phase5-roadmap-one-shot.yml'

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply roadmap update
        run: python3 scripts/phase5-roadmap-complete.py
      - name: Commit roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git diff --cached --check
          git commit -m 'docs: mark Phase 5 complete'
          git push origin HEAD:main
