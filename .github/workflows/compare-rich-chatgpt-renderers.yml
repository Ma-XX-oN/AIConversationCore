name: Compare rich ChatGPT production renderers
on: push
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current renderer sources
        run: |
          git clone --depth 1 https://github.com/Ma-XX-oN/AI-General-Memory.git /tmp/ai-general-memory
          git clone --depth 1 https://github.com/Ma-XX-oN/DownloadConversation.git /tmp/download-conversation
      - name: Render with current AI-transcript.py
        run: |
          mkdir -p tests/evidence/chatgpt-direct-comparison
          python /tmp/ai-general-memory/scripts/AI-transcript.py \
            --chatgpt \
            --file tests/fixtures/chatgpt/chatgpt-direct.jsonl \
            --color=never \
            > tests/evidence/chatgpt-direct-comparison/ai-transcript.md
      - name: Render with current DownloadConversation production renderer
        run: |
          cat > /tmp/render-download-conversation.cjs <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          globalThis.localStorage = { getItem: () => null, setItem: () => {} };
          globalThis.sessionStorage = { getItem: () => null, setItem: () => {} };
          globalThis.window = {};
          globalThis.document = {};

          const userscriptPath = '/tmp/download-conversation/chatgpt-conversation-markdown-export.user.js';
          let source = fs.readFileSync(userscriptPath, 'utf8');
          const marker = "  document.addEventListener('visibilitychange'";
          if (!source.includes(marker)) throw new Error('Could not locate userscript bootstrap marker.');
          source = source.replace(
            marker,
            "  globalThis.__dcProductionRenderer = { renderConversationMarkdown };\n  return;\n\n" + marker
          );
          vm.runInThisContext(source, { filename: userscriptPath });
          if (!globalThis.__dcProductionRenderer?.renderConversationMarkdown) {
            throw new Error('Production renderConversationMarkdown was not exposed.');
          }

          const fixture = fs.readFileSync('tests/fixtures/chatgpt/chatgpt-direct.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(line => line.trim())
            .map(line => JSON.parse(line));
          const spine = {
            records: fixture.map((message, ordinal) => ({
              ordinal,
              message_id: message.id,
              role: message?.author?.role ?? null,
              message
            }))
          };
          const markdown = globalThis.__dcProductionRenderer.renderConversationMarkdown(spine);
          fs.writeFileSync(
            'tests/evidence/chatgpt-direct-comparison/download-conversation.md',
            markdown,
            'utf8'
          );
          NODE
          node /tmp/render-download-conversation.cjs
      - name: Record provenance and raw diff
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('tests/evidence/chatgpt-direct-comparison')
          fixture = pathlib.Path('tests/fixtures/chatgpt/chatgpt-direct.jsonl')
          py_script = pathlib.Path('/tmp/ai-general-memory/scripts/AI-transcript.py')
          dc_script = pathlib.Path('/tmp/download-conversation/chatgpt-conversation-markdown-export.user.js')

          def sha256(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()

          data = {
            'fixture': {
              'path': str(fixture),
              'sha256': sha256(fixture),
            },
            'ai_transcript': {
              'repository': 'Ma-XX-oN/AI-General-Memory',
              'commit': subprocess.check_output(['git', '-C', '/tmp/ai-general-memory', 'rev-parse', 'HEAD'], text=True).strip(),
              'script_path': 'scripts/AI-transcript.py',
              'script_sha256': sha256(py_script),
              'output_sha256': sha256(root / 'ai-transcript.md'),
            },
            'download_conversation': {
              'repository': 'Ma-XX-oN/DownloadConversation',
              'commit': subprocess.check_output(['git', '-C', '/tmp/download-conversation', 'rev-parse', 'HEAD'], text=True).strip(),
              'script_path': 'chatgpt-conversation-markdown-export.user.js',
              'script_sha256': sha256(dc_script),
              'execution_note': 'Production userscript loaded unchanged except for a test-only injection that exposes renderConversationMarkdown and returns before UI/bootstrap side effects.',
              'image_note': 'No authenticated browser image-resource recovery data was injected; this output shows intrinsic production renderer fallback semantics for the fixture.',
              'output_sha256': sha256(root / 'download-conversation.md'),
            },
          }
          (root / 'provenance.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          diff -u \
            tests/evidence/chatgpt-direct-comparison/ai-transcript.md \
            tests/evidence/chatgpt-direct-comparison/download-conversation.md \
            > tests/evidence/chatgpt-direct-comparison/raw.diff || true
      - name: Re-run core tests and Phase 2 gate
        run: |
          npm test
          python tests/validate-phase2-baseline.py
      - name: Commit evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evidence/chatgpt-direct-comparison
          git rm .github/workflows/compare-rich-chatgpt-renderers.yml
          git commit -m "test: capture rich ChatGPT renderer comparison evidence"
          git push
