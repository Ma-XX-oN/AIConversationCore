name: Verify Phase 3 tool events

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'DESIGN.md'
      - 'DECISIONS.md'
      - 'README.md'
      - 'ROADMAP.md'
      - '.github/workflows/verify-phase3-tool-events.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: npm test
      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Validate canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Validate canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Validate canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Validate provider example regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-phase3-tool-events.yml
          git commit -m "chore: remove temporary Phase 3 tool verification workflow"
          git push
