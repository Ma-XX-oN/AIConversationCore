name: Rebuild browser bundle once

on:
  push:
    paths:
      - '.github/workflows/rebuild-browser-bundle-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:browser
      - run: npm test
      - name: Commit regenerated bundle
        run: |
          if git diff --quiet -- dist/aiconversationcore.chatgpt.browser.js; then
            echo 'Bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/aiconversationcore.chatgpt.browser.js
          git commit -m 'build: regenerate browser bundle'
          git push
