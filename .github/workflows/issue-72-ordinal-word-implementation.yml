name: Issue 72 ordinal word identity implementation

on:
  push:
    branches:
      - issue-72-speech-prefix-word-identity
    paths:
      - '.github/workflows/issue-72-ordinal-word-implementation.yml'
      - 'scripts/issue-72-ordinal-word-implementation.mjs'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply ordinal word identity implementation
        run: node scripts/issue-72-ordinal-word-implementation.mjs

      - name: Regenerate browser bundle
        run: node scripts/build-browser-bundle.mjs

      - name: Verify focused ordinal identity and word contracts
        run: |
          node --test \
            tests/canonical-list-ordinal-word-identity.test.js \
            tests/canonical-word-ids.test.js \
            tests/canonical-word-lookup.test.js \
            tests/canonical-word-provenance.test.js \
            tests/canonical-word-separators.test.js \
            tests/ordered-list-ordinals.test.js

      - name: Verify production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: Run complete Core suite
        run: npm test

      - name: Validate canonical goldens and provider regressions
        run: |
          python tests/validate-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
          python tests/validate-provider-example-regressions.py
          python tests/validate-phase2-baseline.py

      - name: Verify deterministic browser bundle and patch integrity
        run: |
          node scripts/build-browser-bundle.mjs
          git diff --exit-code -- package-lock.json dist/aiconversationcore.chatgpt.browser.js
          git diff --check

      - name: Verify superseded prefix API is absent from production and stable design
        run: |
          if git grep -n 'speech_prefix_before\|Canonical structural speech prefixes' -- \
              src tests DESIGN.md README.md RENDERING.md RETAINED_SESSIONS.md; then
            echo 'Superseded prefix semantics remain outside the historical decision log.' >&2
            exit 1
          fi

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests DESIGN.md DECISIONS.md dist/aiconversationcore.chatgpt.browser.js
          git diff --cached --check
          git commit -m 'fix: make list ordinals canonical word identities (#72)'
          git push origin HEAD:issue-72-speech-prefix-word-identity
