name: Build committed browser artifact

on:
  push:
    branches:
      - main
      - 'issue-*'
      - 'feature/**'
    paths:
      - '.github/workflows/**'
      - package.json
      - scripts/build-browser-bundle.mjs
      - 'src/**'
      - .github/workflows/build-browser-artifact.yml

permissions:
  contents: read

concurrency:
  group: browser-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actions-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce permanent Actions policy
        run: node --test tests/actions-policy.test.js

  build-artifact:
    needs: actions-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build deterministic browser artifact
        run: npm run build:browser

      - name: Reject non-artifact mutation
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- . ':!dist/aiconversationcore.chatgpt.browser.js')"
          if [ -n "$unexpected" ]; then
            printf 'Browser artifact build changed forbidden paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Commit generated artifact when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/aiconversationcore.chatgpt.browser.js; then
            echo 'Browser artifact already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/aiconversationcore.chatgpt.browser.js
          staged="$(git diff --cached --name-only)"
          test "$staged" = 'dist/aiconversationcore.chatgpt.browser.js'
          git commit -m 'build: regenerate browser artifact'
          git push origin "HEAD:${GITHUB_REF_NAME}"
