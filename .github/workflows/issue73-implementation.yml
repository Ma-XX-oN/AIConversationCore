name: Issue 73 implementation

on:
  push:
    branches:
      - feature/canonical-presentation-html
    paths:
      - .github/workflows/issue73-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/canonical-presentation-html
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add failing Codex IDE-context regression first
        run: |
          cat > tests/codex-user-context.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import {
            adaptCodexRecords,
            buildCanonicalPresentation,
            renderCanonicalMarkdown
          } from '../src/index.js';

          const CONTEXT_MESSAGE = `# Context from my IDE setup:

          ## Active file: sessions/example.jsonl

          ## Active selection of the file:
           the repo instructions and the current transcript script first
          ## Open tabs:
          - example.jsonl: sessions/example.jsonl

          ## My request for Codex:
          I'm doing some testing. What time is it in Paris?`;

          test('Codex IDE context is semantic and renders as blockquoted details before the prompt', () => {
            const events = adaptCodexRecords([{
              type: 'event_msg',
              timestamp: '2026-09-06T15:17:11.000Z',
              payload: { type: 'user_message', message: CONTEXT_MESSAGE }
            }]);

            assert.equal(events.length, 1);
            assert.deepEqual(events[0].blocks.map(block => block.type), ['user_context', 'text']);
            assert.equal(events[0].blocks[0].summary, '# Context from my IDE setup:');
            assert.equal(events[0].blocks[0].text,
              '## Active file: sessions/example.jsonl\n\n' +
              '## Active selection of the file:\n' +
              ' the repo instructions and the current transcript script first\n' +
              '## Open tabs:\n' +
              '- example.jsonl: sessions/example.jsonl');
            assert.equal(events[0].blocks[1].text,
              "I'm doing some testing. What time is it in Paris?");

            const markdown = renderCanonicalMarkdown(events);
            assert.equal(markdown, `## User

          > <details><summary># Context from my IDE setup:</summary>
          >
          > ## Active file: sessions/example.jsonl
          >
          > ## Active selection of the file:
          >  the repo instructions and the current transcript script first
          > ## Open tabs:
          > - example.jsonl: sessions/example.jsonl
          >
          > </details>

          I'm doing some testing. What time is it in Paris?`);
            assert.equal(markdown.includes('## My request for Codex:'), false);

            const presentation = buildCanonicalPresentation(events);
            assert.equal(presentation.turns.length, 1);
            assert.deepEqual(
              presentation.turns[0].children.map(child => child.kind),
              ['user_context', 'markdown']
            );
            assert.equal(presentation.turns[0].children[0].blocks[0].type, 'user_context');
            assert.equal(presentation.turns[0].children[1].blocks[0].text,
              "I'm doing some testing. What time is it in Paris?");
          });

          test('ordinary Codex user messages retain the existing single text block and quoted rendering', () => {
            const events = adaptCodexRecords([{
              type: 'event_msg',
              timestamp: '2026-09-06T15:18:00.000Z',
              payload: { type: 'user_message', message: 'Plain user prompt.' }
            }]);

            assert.deepEqual(events[0].blocks.map(block => block.type), ['text']);
            assert.equal(events[0].blocks[0].text, 'Plain user prompt.');
            assert.equal(renderCanonicalMarkdown(events), '## User\n\n> Plain user prompt.');
          });

          test('a context heading without a request marker is preserved as ordinary user text', () => {
            const message = '# Context from my IDE setup:\n\n## Active file: example.txt';
            const events = adaptCodexRecords([{
              type: 'event_msg',
              timestamp: '2026-09-06T15:19:00.000Z',
              payload: { type: 'user_message', message }
            }]);

            assert.deepEqual(events[0].blocks.map(block => block.type), ['text']);
            assert.equal(events[0].blocks[0].text, message);
          });
          EOF
          git add tests/codex-user-context.test.js
          git commit -m "test: define Codex IDE user context contract"

      - name: Prove the regression fails before implementation
        run: |
          set +e
          node --test tests/codex-user-context.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Issue 73 regression unexpectedly passed before implementation."
            exit 1
          fi
          echo "Regression failed before implementation as required."

      - name: Implement semantic Codex IDE-context split and presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          codex = Path('src/adapters/codex.js')
          text = codex.read_text()
          anchor = "function source(record, sourceIndex) {\n  return {\n    provider: 'codex',\n    record_id: null,\n    record_index: sourceIndex\n  };\n}\n"
          addition = anchor + "\nconst CODEX_IDE_CONTEXT_HEADING = '# Context from my IDE setup:';\nconst CODEX_REQUEST_HEADING = '## My request for Codex:';\n\n/**\n * Splits evidenced Codex IDE context from the actual User prompt.\n *\n * The split is intentionally conservative: both the leading IDE-context heading\n * and a line-delimited request heading must be present. Otherwise the complete\n * source message remains ordinary User text so malformed/partial context is not\n * silently discarded.\n *\n * @param {string} message - Raw Codex User message text.\n * @returns {{context: string, prompt: string}|null} Separated context/prompt, or null when the evidenced envelope is absent.\n */\nfunction splitCodexUserMessage(message) {\n  const normalized = String(message ?? '').replaceAll('\\r\\n', '\\n');\n  if (normalized !== CODEX_IDE_CONTEXT_HEADING &&\n      !normalized.startsWith(`${CODEX_IDE_CONTEXT_HEADING}\\n`)) return null;\n\n  const marker = `\\n${CODEX_REQUEST_HEADING}\\n`;\n  const markerIndex = normalized.indexOf(marker);\n  if (markerIndex < 0) return null;\n\n  const context = normalized.slice(CODEX_IDE_CONTEXT_HEADING.length, markerIndex)\n    .replace(/^\\n+/, '')\n    .replace(/\\n+$/, '');\n  const prompt = normalized.slice(markerIndex + marker.length).replace(/^\\n+/, '');\n  return { context, prompt };\n}\n"
          if text.count(anchor) != 1:
            raise SystemExit('codex source() anchor mismatch')
          text = text.replace(anchor, addition, 1)

          anchor = "function messageEvent(record, sourceIndex, role, kind, channel, text, contentType) {\n  const sourceInfo = source(record, sourceIndex);\n  return {\n    id: `codex:record:${sourceIndex}:${kind}`,\n    provider: 'codex',\n    source_record_id: null,\n    source_index: sourceIndex,\n    kind,\n    role,\n    channel,\n    visibility: 'visible',\n    content_type: contentType,\n    blocks: [{\n      id: `codex:record:${sourceIndex}:${kind}:block`,\n      type: kind === 'reasoning_summary' ? 'reasoning_summary' : 'text',\n      ...(kind === 'reasoning_summary'\n        ? { summary: null, content: text, chunks: null, finished: null }\n        : { text }),\n      source: sourceInfo\n    }],\n    citations: [],\n    resources: [],\n    relationships: { tool_call_id: null },\n    source: sourceInfo\n  };\n}\n"
          addition = anchor + "\n/**\n * Builds a Codex User event while preserving IDE context as a semantic block.\n *\n * @param {Object<string, *>} record - Codex User source record.\n * @param {number} sourceIndex - Zero-based source-record index.\n * @returns {Object<string, *>} Canonical User message event.\n */\nfunction userMessageEvent(record, sourceIndex) {\n  const message = record?.payload?.message ?? '';\n  const split = splitCodexUserMessage(message);\n  const event = messageEvent(record, sourceIndex, 'user', 'message', null,\n    split?.prompt ?? message, 'user_message');\n  if (!split) return event;\n\n  const sourceInfo = source(record, sourceIndex);\n  event.blocks = [\n    {\n      id: `codex:record:${sourceIndex}:message:user_context`,\n      type: 'user_context',\n      context_kind: 'ide_setup',\n      summary: CODEX_IDE_CONTEXT_HEADING,\n      text: split.context,\n      source: sourceInfo\n    },\n    {\n      id: `codex:record:${sourceIndex}:message:block`,\n      type: 'text',\n      text: split.prompt,\n      source: sourceInfo\n    }\n  ];\n  return event;\n}\n"
          if text.count(anchor) != 1:
            raise SystemExit('codex messageEvent anchor mismatch')
          text = text.replace(anchor, addition, 1)

          old = "    if (payload.type === 'user_message' && typeof payload.message === 'string') {\n      events.push(messageEvent(record, sourceIndex, 'user', 'message', null,\n        payload.message, 'user_message'));\n      return;\n    }"
          new = "    if (payload.type === 'user_message' && typeof payload.message === 'string') {\n      events.push(userMessageEvent(record, sourceIndex));\n      return;\n    }"
          if text.count(old) != 1:
            raise SystemExit('codex user-message branch mismatch')
          codex.write_text(text.replace(old, new, 1))

          presentation = Path('src/projections/presentation.js')
          text = presentation.read_text()
          old = "  const attachments = blocks.filter(block =>\n    block?.type === 'image' ||\n    block?.type === 'attachment' ||\n    block?.type === 'file'\n  );\n  const body = blocks.filter(block => !attachments.includes(block));\n  const children = [];\n  if (attachments.length) {\n    children.push(contentNode(event, 'attachments', attachments));\n  }\n  if (body.length || !attachments.length) {\n    children.push(contentNode(event, 'markdown', body));\n  }"
          new = "  const attachments = blocks.filter(block =>\n    block?.type === 'image' ||\n    block?.type === 'attachment' ||\n    block?.type === 'file'\n  );\n  const contexts = blocks.filter(block => block?.type === 'user_context');\n  const body = blocks.filter(block =>\n    !attachments.includes(block) && !contexts.includes(block));\n  const children = [];\n  if (attachments.length) {\n    children.push(contentNode(event, 'attachments', attachments));\n  }\n  if (contexts.length) {\n    children.push(contentNode(event, 'user_context', contexts));\n  }\n  if (body.length || (!attachments.length && !contexts.length)) {\n    children.push(contentNode(event, 'markdown', body));\n  }"
          if text.count(old) != 1:
            raise SystemExit('presentation userChildren anchor mismatch')
          presentation.write_text(text.replace(old, new, 1))

          markdown = Path('src/projections/markdown.js')
          text = markdown.read_text()
          old = "/**\n * Renders user.\n *\n * @param {Object<string, *>} event - The canonical event being inspected, normalized, or rendered.\n * @returns {string} The complete User transcript section for the canonical event.\n */\nfunction renderUser(event) {\n  return projectedSection(event, `${projectedHeading(event, '## User')}\\n\\n${quoteMarkdown(renderMessageBlocks(event))}`);\n}\n"
          new = "/**\n * Renders one semantic User-context block as a blockquoted details disclosure.\n *\n * @param {Object<string, *>} block - Canonical User-context block.\n * @returns {string} Blockquoted Markdown/HTML details fragment.\n */\nfunction renderUserContextBlock(block) {\n  const summary = htmlEscape(block?.summary ?? '# Context from my IDE setup:');\n  const body = String(block?.text ?? '');\n  return quoteMarkdown(`<details><summary>${summary}</summary>\\n\\n${body}\\n\\n</details>`);\n}\n\n/**\n * Renders user.\n *\n * Semantic User context is presented before the actual prompt in a blockquoted\n * details disclosure. The prompt remains outside that blockquote so consumers\n * can assign context and prompt distinct User speech voices without reparsing\n * provider-native text. User events without semantic context retain the existing\n * fully-blockquoted rendering contract.\n *\n * @param {Object<string, *>} event - The canonical event being inspected, normalized, or rendered.\n * @returns {string} The complete User transcript section for the canonical event.\n */\nfunction renderUser(event) {\n  const blocks = Array.isArray(event?.blocks) ? event.blocks : [];\n  const contexts = blocks.filter(block => block?.type === 'user_context');\n  if (!contexts.length) {\n    return projectedSection(event, `${projectedHeading(event, '## User')}\\n\\n${quoteMarkdown(renderMessageBlocks(event))}`);\n  }\n\n  const promptEvent = {\n    ...event,\n    blocks: blocks.filter(block => block?.type !== 'user_context')\n  };\n  const parts = contexts.map(renderUserContextBlock);\n  const prompt = renderMessageBlocks(promptEvent);\n  if (prompt) parts.push(prompt);\n  return projectedSection(event, `${projectedHeading(event, '## User')}\\n\\n${parts.join('\\n\\n')}`);\n}\n"
          if text.count(old) != 1:
            raise SystemExit('markdown renderUser anchor mismatch')
          markdown.write_text(text.replace(old, new, 1))
          PY

      - name: Regenerate deterministic browser bundle
        run: npm run build:browser

      - name: Run focused regression
        run: node --test tests/codex-user-context.test.js

      - name: Check production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: Run complete core tests
        run: npm test

      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py

      - name: Validate canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py

      - name: Validate canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py

      - name: Validate canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py

      - name: Validate provider example regressions
        run: python tests/validate-provider-example-regressions.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit implementation and generated bundle
        run: |
          git add src/adapters/codex.js src/projections/presentation.js src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m "feat: model Codex IDE user context"
          git push origin HEAD:feature/canonical-presentation-html
