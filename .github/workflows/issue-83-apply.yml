name: Issue 83 word separators

on:
  push:
    branches:
      - issue-83-word-separators
    paths:
      - '.github/workflows/issue-83-apply.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Clean source and record stable contracts
        run: python scripts/apply-issue-83.py

      - name: Regenerate deterministic browser bundle
        run: node scripts/build-browser-bundle.mjs

      - name: Verify focused word identity regressions after cleanup
        run: |
          node --test \
            tests/canonical-word-separators.test.js \
            tests/canonical-word-provenance.test.js \
            tests/canonical-word-ids.test.js \
            tests/canonical-word-lookup.test.js \
            tests/browser-bundle.test.js
          git diff --check

      - name: Commit cleaned source and docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/projections/word-identity.js \
            DESIGN.md \
            DECISIONS.md
          git commit -m 'docs: define canonical word separator contract (#83)'
          git push origin HEAD:issue-83-word-separators
