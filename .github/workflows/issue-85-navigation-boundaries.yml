name: Issue 85 navigation-boundary validation

on:
  push:
    branches:
      - issue-85-navigation-boundaries

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: issue-85-navigation-boundaries
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install permanent regression only
        run: python tools/issue85-navigation-boundaries.py test

      - name: Prove structural navigation regression RED
        shell: bash
        run: |
          set +e
          node --test tests/canonical-navigation-boundaries.test.js > /tmp/issue85-red.log 2>&1
          status=$?
          set -e
          cat /tmp/issue85-red.log
          if [ "$status" -eq 0 ]; then
            echo "Issue #85 regression unexpectedly passed before production repair."
            exit 1
          fi
          grep -F "Paragraph and list-item starts must be explicit canonical navigation boundaries." /tmp/issue85-red.log

      - name: Apply production repair
        run: python tools/issue85-navigation-boundaries.py production

      - name: Focused GREEN
        run: node --test tests/canonical-navigation-boundaries.test.js tests/canonical-word-separators.test.js tests/canonical-word-ids.test.js tests/canonical-word-lookup.test.js tests/canonical-word-provenance.test.js

      - name: Rebuild browser bundle
        run: npm run build:browser

      - name: Check production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: Run complete Core tests
        run: npm test

      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py

      - name: Validate canonical goldens
        run: |
          python tests/validate-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
          python tests/validate-provider-example-regressions.py

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit clean Core candidate
        shell: bash
        run: |
          git rm .github/workflows/issue-85-navigation-boundaries.yml tools/issue85-navigation-boundaries.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projections/word-identity.js tests/canonical-navigation-boundaries.test.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m "feat: expose canonical navigation boundaries"
          git push origin HEAD:issue-85-navigation-boundaries
