name: Inspect core documentation state once

on:
  push:
    paths:
      - .github/workflows/inspect-doc-state-once.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top-level declarations
        run: |
          for f in $(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) ! -name 'check-jsdoc.mjs' | sort); do
            echo "===== $f ====="
            grep -nE '^(export )?(const|let|var) [A-Za-z_$][A-Za-z0-9_$]*' "$f" || true
          done
      - name: Potentially non-obvious locals
        run: |
          for f in $(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) ! -name 'check-jsdoc.mjs' | sort); do
            echo "===== $f ====="
            grep -nE '^[[:space:]]+(const|let|var) .*([Ss]tate|[Cc]ache|[Cc]ursor|[Oo]rdinal|[Ss]equence|[Cc]ontext|[Ii]ndex|[Mm]ap|[Ss]et|[Rr]ecover|[Pp]ending|[Aa]nchor|[Gg]roup|[Cc]lassif|[Ss]ource|[Rr]ecord|[Bb]lock|[Tt]ool|[Rr]esource|[Cc]itation|[Tt]urn|[Ee]vent|[Rr]ender)' "$f" || true
          done
