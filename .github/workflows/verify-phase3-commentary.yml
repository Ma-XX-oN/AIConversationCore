name: Verify Phase 3 commentary slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-phase3-commentary.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run core tests
        run: npm test
      - name: Re-run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Verify rich fixture provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/fixtures/chatgpt/chatgpt-direct.jsonl)" = "1631c0b4fe7b059759d3546f9c8ab54d6ae22c92"
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm .github/workflows/verify-phase3-commentary.yml
          git commit -m 'Remove temporary Phase 3 commentary verification workflow [skip ci]'
          git push origin main
