name: Finalize structural identity attributes
on:
  push:
    branches: [feature/canonical-render-api-work]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-api-work
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/projections/markdown.js')
          text = path.read_text(encoding='utf-8')
          old = '''  const unitAttributes = reasoningGroup && events.length\n    ? ` data-ai-unit-id="${htmlEscape(presentationUnitId('reasoning_group', events))}" data-ai-boundary="atomic" data-ai-source-event-ids="${htmlEscape(events.map(event => event?.id ?? '').filter(Boolean).join(' '))}"`\n    : '';\n'''
          new = '''  const unitAttributes = reasoningGroup && events.length\n    ? ` data-ai-unit-id="${htmlEscape(presentationUnitId('reasoning_group', events))}" data-ai-boundary="atomic" data-ai-source-event-ids="${htmlEscape(events.map(event => event?.id ?? '').filter(Boolean).join(' '))}" data-ai-source-record-ids="${htmlEscape(events.map(event => event?.source_record_id ?? '').filter(Boolean).join(' '))}" data-ai-source-record-indexes="${htmlEscape(events.map(event => Number.isInteger(event?.source_index) ? event.source_index : '').filter(value => value !== '').join(' '))}"`\n    : '';\n'''
          if old not in text:
            raise SystemExit('unitAttributes block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/render-api.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace("  assert.match(html.content, /data-ai-source-event-ids=\\\"event-r1 event-r2 event-r3\\\"/);", "  assert.match(html.content, /data-ai-source-event-ids=\\\"event-r1 event-r2 event-r3\\\"/);\n  assert.match(html.content, /data-ai-source-record-ids=\\\"record-r1 record-r2 record-r3\\\"/);\n  assert.match(html.content, /data-ai-source-record-indexes=\\\"0 1 2\\\"/);", 1)
          text = text.replace("  const detailsStart = html.content.indexOf('<details>');", "  const detailsStart = html.content.indexOf('<details');", 1)
          test.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/finalize-structural-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "render: expose atomic source record identities"
          git push origin HEAD:feature/canonical-render-api-work
