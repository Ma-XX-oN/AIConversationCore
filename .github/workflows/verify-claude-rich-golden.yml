name: Verify Claude rich golden evidence

on:
  push:
    paths:
      - 'tests/fixtures/claude/claude-rich-subagent.jsonl'
      - '.github/workflows/verify-claude-rich-golden.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current AI transcript source
        run: git clone --depth 1 https://github.com/Ma-XX-oN/AI-General-Memory.git /tmp/ai-general-memory
      - name: Install colorama
        run: python -m pip install colorama
      - name: Render plain Claude evidence
        run: python /tmp/ai-general-memory/scripts/AI-transcript.py --claude --file tests/fixtures/claude/claude-rich-subagent.jsonl --color=never > claude-rich.plain.md
      - name: Render decorated Claude evidence
        run: python /tmp/ai-general-memory/scripts/AI-transcript.py --claude --file tests/fixtures/claude/claude-rich-subagent.jsonl -dn --color=always > claude-rich.decorated.md
      - name: Record source provenance
        run: |
          git -C /tmp/ai-general-memory rev-parse HEAD > ai-transcript-source-commit.txt
          git -C /tmp/ai-general-memory hash-object scripts/AI-transcript.py > ai-transcript-script-blob.txt
          sha256sum tests/fixtures/claude/claude-rich-subagent.jsonl claude-rich.plain.md claude-rich.decorated.md > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: claude-rich-render-evidence
          path: |
            claude-rich.plain.md
            claude-rich.decorated.md
            ai-transcript-source-commit.txt
            ai-transcript-script-blob.txt
            sha256sums.txt
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/verify-claude-rich-golden.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'chore: remove temporary Claude rich verification workflow'
          git push
