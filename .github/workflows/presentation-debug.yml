name: Presentation debug

on:
  push:
    branches:
      - feature/canonical-presentation-html

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and commit browser bundle
        shell: bash
        run: |
          node scripts/build-browser-bundle.mjs
          if git diff --quiet -- dist/aiconversationcore.chatgpt.browser.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/aiconversationcore.chatgpt.browser.js
          git commit -m "regenerate browser bundle for presentation tree"
          git push
