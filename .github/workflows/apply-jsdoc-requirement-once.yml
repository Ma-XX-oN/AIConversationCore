name: Apply JSDoc requirement once

on:
  push:
    paths:
      - .github/workflows/apply-jsdoc-requirement-once.yml
      - scripts/apply-jsdoc-requirement.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply documentation pass
        run: python scripts/apply-jsdoc-requirement.py
      - name: JSDoc audit
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Full tests
        run: node --test tests/*.test.js
      - name: JSDoc audit after bundle build
        run: node scripts/check-jsdoc.mjs
      - name: Verify documentation-only diff
        run: |
          git diff --check
          git status --short
          if git diff -U0 -- src scripts AI_AGENT_RULES.md | grep -E '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*(/\*\*|\*|\*/|//|$|## Code documentation standard|Every named production|and function-valued|comment must state|representation and|Do not rely|function-level|algorithm details|separate JSDoc|const roots|const files|for \(const root|if \(!fs|const walk|for \(const entry|const full|if \(entry|else if|walk\(root|const patterns|const failures|for \(const file|const text|for \(const pattern|pattern.lastIndex|for \(let match|const prefix|if \(!/|const line|failures.push|if \(failures.length|console.error|process.exit|console.log|import fs|import path)'; then
            echo 'Unexpected non-documentation source change detected.' >&2
            exit 1
          fi
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/check-jsdoc.mjs AI_AGENT_RULES.md dist/aiconversationcore.chatgpt.browser.js
          git commit -m "docs: document production functions and transformations"
          git push
