name: Finish JSDoc descriptions once

on:
  push:
    paths:
      - .github/workflows/finish-jsdoc-descriptions-once.yml
      - scripts/finish-jsdoc-descriptions-once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Complete semantic-description table
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finish-jsdoc-descriptions-once.py')
          text = path.read_text()
          marker = "  'callId': 'The correlated provider tool-call identifier, or null when unavailable.',\n"
          additions = """  'callName': 'The normalized provider tool name associated with the correlated call, or null when unavailable.',
  'index': 'The zero-based position of the current item within its ordered source collection.',
  'question': 'The normalized question object being rendered or converted.',
  'option': 'The normalized selectable option being rendered or converted.',
  'value': 'The source value being normalized, formatted, or emitted by this operation.',
  'format': 'The requested output format for the projection.',
  'directory': 'The directory path whose entries are being enumerated.',
  'entry': 'The current filesystem directory entry being inspected.',
  'root': 'The source-root directory currently being traversed.',
"""
          if "  'callName':" not in text:
            if marker not in text:
              raise SystemExit('callId insertion marker not found')
            text = text.replace(marker, marker + additions, 1)
            path.write_text(text)
          PY
      - name: Finish semantic descriptions/types
        run: python scripts/finish-jsdoc-descriptions-once.py
      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Reject placeholder documentation
        run: |
          if grep -R -n -E 'value used by this operation|value required by this function|text representation produced by|structured value produced by|The value produced by' src scripts --include='*.js' --include='*.mjs' --exclude='check-jsdoc.mjs'; then
            echo 'Placeholder JSDoc descriptions remain.' >&2
            exit 1
          fi
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/build-browser-bundle.mjs dist/aiconversationcore.chatgpt.browser.js
          git commit -m "docs: complete JSDoc parameter and return contracts"
          git push
