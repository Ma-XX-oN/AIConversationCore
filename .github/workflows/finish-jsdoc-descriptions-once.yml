name: Finish JSDoc descriptions once

on:
  push:
    paths:
      - .github/workflows/finish-jsdoc-descriptions-once.yml
      - scripts/finish-jsdoc-descriptions-once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Finish semantic descriptions/types
        run: python scripts/finish-jsdoc-descriptions-once.py
      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Reject placeholder documentation
        run: |
          if grep -R -n -E 'value used by this operation|value required by this function|text representation produced by|structured value produced by|The value produced by' src scripts --include='*.js' --include='*.mjs' --exclude='check-jsdoc.mjs'; then
            echo 'Placeholder JSDoc descriptions remain.' >&2
            exit 1
          fi
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/build-browser-bundle.mjs dist/aiconversationcore.chatgpt.browser.js
          git commit -m "docs: complete JSDoc parameter and return contracts"
          git push
