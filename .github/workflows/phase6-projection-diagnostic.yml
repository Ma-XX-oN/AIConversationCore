name: Diagnose Phase 6 projection regression

on:
  push:
    paths:
      - .github/workflows/phase6-projection-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply staged projection patch
        run: |
          python scripts/apply-phase6-projection-options.py
          python scripts/fix-phase6-projection-jsdoc.py
      - name: Report only failing core tests
        run: |
          set +e
          npm test > /tmp/core-test.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "CORE_TESTS_PASS"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/core-test.log').read_text(errors='replace').splitlines()
          needles = ('not ok ', 'AssertionError', 'ERR_ASSERTION', 'actual:', 'expected:', 'operator:', 'failureType:', 'error:')
          for i, line in enumerate(lines):
            if any(needle in line for needle in needles):
              lo = max(0, i - 3)
              hi = min(len(lines), i + 12)
              print('\n'.join(lines[lo:hi]))
              print('---')
          PY
          exit "$rc"
