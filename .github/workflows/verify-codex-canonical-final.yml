name: Verify canonical rich Codex golden

on:
  push:
    paths:
      - 'tests/fixtures/codex/codex-rich.jsonl'
      - 'tests/golden/codex/**'
      - 'tests/codex-canonical-golden-manifest.json'
      - 'tests/validate-codex-canonical-golden.py'
      - '.github/workflows/verify-codex-canonical-final.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: npm test
      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Validate canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Validate canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Validate canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/verify-codex-canonical-final.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'chore: remove temporary Codex canonical verification workflow'
          git push
