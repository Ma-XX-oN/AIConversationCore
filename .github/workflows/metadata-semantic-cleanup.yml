name: Metadata semantic cleanup

on:
  push:
    paths:
      - '.github/workflows/metadata-semantic-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/projections/markdown.js')
          text = path.read_text(encoding='utf-8')
          normal_old = """  if (metadata.show_turn_id && event?.source_record_id != null) {
    fields.push(`<!-- turn_id=${event.source_record_id} -->`);
  }
"""
          normal_new = """  if (metadata.show_turn_id && event?.source_record_id != null) {
    fields.push(`turn_id=${event.source_record_id}`);
  }
"""
          if normal_old not in text:
            raise SystemExit('normal turn-id projection point not found')
          text = text.replace(normal_old, normal_new, 1)

          comment_old = """ * DownloadConversation-compatible `turn_id` and `record_index` field names.
 * `turn_id` is the provider/source record identity retained as
 * `source_record_id`; it is not the separately derived canonical turn ID.
"""
          comment_new = """ * `record_id` and `record_index` field names. `record_id` is the native
 * provider/source record identity retained as `source_record_id`; it is
 * deliberately distinct from first-class turn identity.
"""
          if comment_old not in text:
            raise SystemExit('debug provenance documentation point not found')
          text = text.replace(comment_old, comment_new, 1)

          debug_old = """  if (event?.source_record_id != null) fields.push(`turn_id=${event.source_record_id}`);
  if (Number.isInteger(event?.source_index)) fields.push(`record_index=${event.source_index}`);
"""
          debug_new = """  if (event?.source_record_id != null) fields.push(`record_id=${event.source_record_id}`);
  if (Number.isInteger(event?.source_index)) fields.push(`record_index=${event.source_index}`);
"""
          if debug_old not in text:
            raise SystemExit('debug provenance projection point not found')
          text = text.replace(debug_old, debug_new, 1)
          path.write_text(text, encoding='utf-8')

          heading_test = Path('tests/heading-metadata-projection.test.js')
          text = heading_test.read_text(encoding='utf-8')
          old = r"/^## User \[2026-08-31 15:00:00\]: 2: <!-- turn_id=chatgpt-message-id -->$/m"
          new = r"/^## User \[2026-08-31 15:00:00\]: 2: turn_id=chatgpt-message-id$/m"
          if old not in text:
            raise SystemExit('first-class turn-id expectation not found')
          heading_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          for test in Path('tests').glob('*.js'):
            if test == heading_test:
              continue
            text = test.read_text(encoding='utf-8')
            text = text.replace('<!-- turn_id=', '<!-- record_id=')
            text = text.replace(' turn_id=', ' record_id=')
            test.write_text(text, encoding='utf-8')
      - name: Build and test
        run: |
          npm test
          npm run build:browser
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/projections/markdown.js tests dist
          git commit -m 'projection: separate turn id from debug record provenance'
          git push
