# One-shot metadata semantic cleanup runner.
name: Metadata semantic cleanup

on:
  push:
    paths:
      - '.github/workflows/metadata-semantic-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/projections/markdown.js')
          text = path.read_text(encoding='utf-8')

          heading_start = text.index('function projectedHeadingMetadataSuffix(event) {')
          heading_end = text.index('\n}\n\nfunction projectedHeading(event, label)', heading_start) + 2
          heading_old = text[heading_start:heading_end]
          heading_new = heading_old.replace(
            'fields.push(`<!-- turn_id=${event.source_record_id} -->`);',
            'fields.push(`turn_id=${event.source_record_id}`);',
          )
          if heading_new == heading_old:
            raise SystemExit('normal turn-id projection point not found')
          text = text[:heading_start] + heading_new + text[heading_end:]

          comment_start = text.index('function projectedComment(event, quoted = false) {')
          comment_end = text.index('\n}\n\n/**\n * Appends source debug provenance', comment_start) + 2
          comment_block = text[comment_start:comment_end]
          debug_old = 'if (event?.source_record_id != null) fields.push(`turn_id=${event.source_record_id}`);'
          debug_new = 'if (event?.source_record_id != null) fields.push(`record_id=${event.source_record_id}`);'
          if debug_old not in comment_block:
            raise SystemExit('debug provenance projection point not found')
          comment_block = comment_block.replace(debug_old, debug_new, 1)
          text = text[:comment_start] + comment_block + text[comment_end:]

          doc_old = " * DownloadConversation-compatible `turn_id` and `record_index` field names.\n * `turn_id` is the provider/source record identity retained as\n * `source_record_id`; it is not the separately derived canonical turn ID.\n"
          doc_new = " * `record_id` and `record_index` field names. `record_id` is the native\n * provider/source record identity retained as `source_record_id`; it is\n * deliberately distinct from first-class turn identity.\n"
          if doc_old not in text:
            raise SystemExit('debug provenance documentation point not found')
          text = text.replace(doc_old, doc_new, 1)
          path.write_text(text, encoding='utf-8')

          heading_test = Path('tests/heading-metadata-projection.test.js')
          text = heading_test.read_text(encoding='utf-8')
          old = r"/^## User \[2026-08-31 15:00:00\]: 2: <!-- turn_id=chatgpt-message-id -->$/m"
          new = r"/^## User \[2026-08-31 15:00:00\]: 2: turn_id=chatgpt-message-id$/m"
          if old not in text:
            raise SystemExit('first-class turn-id expectation not found')
          heading_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          for test in Path('tests').glob('*.js'):
            if test == heading_test:
              continue
            text = test.read_text(encoding='utf-8')
            text = text.replace('<!-- turn_id=', '<!-- record_id=')
            test.write_text(text, encoding='utf-8')
      - name: Build and test
        run: |
          npm run build:browser
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/projections/markdown.js tests dist
          git commit -m 'projection: separate turn id from debug record provenance'
          git push
