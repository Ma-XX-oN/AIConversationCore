name: Issue 80 browser bundle update

on:
  push:
    branches:
      - issue-80-canonical-word-ids
    paths:
      - '.github/workflows/issue-80-browser-bundle-update.yml'
      - 'scripts/build-browser-bundle.mjs'
      - 'src/projections/html-visibility.js'
      - 'src/projections/word-element.js'
      - 'src/projections/word-identity.js'

permissions:
  contents: write

jobs:
  update-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate deterministic browser bundle for current Core source
        run: node scripts/build-browser-bundle.mjs

      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- dist/aiconversationcore.chatgpt.browser.js; then
            echo 'Browser bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/aiconversationcore.chatgpt.browser.js
          git commit -m 'build: regenerate browser bundle for canonical word IDs (#80)'
          git push origin HEAD:issue-80-canonical-word-ids
