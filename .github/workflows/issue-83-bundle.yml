name: Issue 83 bundle refresh

on:
  push:
    branches:
      - issue-83-word-separators
    paths:
      - '.github/workflows/issue-83-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate deterministic browser bundle
        run: |
          node scripts/build-browser-bundle.mjs
          git diff --check

      - name: Verify focused browser and word regressions
        run: |
          node --test \
            tests/canonical-word-separators.test.js \
            tests/canonical-word-provenance.test.js \
            tests/canonical-word-ids.test.js \
            tests/canonical-word-lookup.test.js \
            tests/browser-bundle.test.js

      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/aiconversationcore.chatgpt.browser.js
          git commit -m 'build: refresh canonical word separator bundle (#83)'
          git push origin HEAD:issue-83-word-separators
