name: Apply Phase 6 projection options once

on:
  push:
    paths:
      - .github/workflows/phase6-projection-options-once.yml
      - scripts/apply-phase6-projection-options.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply projection metadata support
        run: python scripts/apply-phase6-projection-options.py
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified projection support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projections/markdown.js
          git commit -m "phase6: support consumer transcript projection metadata"
          git push
