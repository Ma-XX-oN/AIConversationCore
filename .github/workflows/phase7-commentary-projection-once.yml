name: Phase 7 commentary projection once

on:
  push:
    paths:
      - .github/workflows/phase7-commentary-projection-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply generic projection to ChatGPT commentary heading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/projections/markdown.js')
          text = path.read_text(encoding='utf-8')
          old = "body.push(projectedSection(event, `### ChatGPT Commentary\\n\\n${quoteMarkdown(text)}`));"
          new = "body.push(projectedSection(event, `${projectedHeading(event, '### ChatGPT Commentary')}\\n\\n${quoteMarkdown(text)}`));"
          if old not in text:
            raise SystemExit('commentary heading renderer anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Rebuild deterministic browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity
        run: python tests/validate-phase2-baseline.py
      - name: Canonical goldens
        run: |
          python tests/validate-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
          python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified projection fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m "phase7: project consumer metadata on commentary headings"
          git push
