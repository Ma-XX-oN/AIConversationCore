name: Fix ChatGPT commentary tools once

on:
  push:
    paths:
      - .github/workflows/fix-commentary-tools-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded renderer fix and regression
        shell: python
        run: |
          from pathlib import Path

          renderer = Path('src/projections/markdown.js')
          text = renderer.read_text(encoding='utf-8')
          old_commentary = '''function renderChatGPTCommentarySegment(reasoningEvents, commentaryEvents) {
            const body = [];
            for (const event of reasoningEvents) {
              const text = reasoningBody(event);
              if (text) body.push(details('Thoughts', text));
            }
            for (const event of commentaryEvents) {
              const text = renderMessageBlocks(event);
              if (text) body.push(quoteMarkdown(text));
            }
            return body.length ? `## ChatGPT Commentary\\n\\n${body.join('\\n\\n')}` : null;
          }
          '''
          new_commentary = '''function renderChatGPTCommentarySegment(segment, events) {
            const body = [];
            let thoughts = [];
            const flushThoughts = () => {
              if (!thoughts.length) return;
              body.push(details('Thoughts', thoughts.join('\\n\\n')));
              thoughts = [];
            };
            for (const event of segment) {
              if (event.kind === 'reasoning_summary') {
                const text = reasoningBody(event);
                if (text) thoughts.push(text);
                continue;
              }
              if (event.kind === 'tool_call' || event.kind === 'tool_result') {
                const text = renderChatGPTToolEvent(event, events);
                if (text) thoughts.push(text);
                continue;
              }
              if (event.kind === 'commentary') {
                flushThoughts();
                const text = renderMessageBlocks(event);
                if (text) body.push(quoteMarkdown(text));
              }
            }
            flushThoughts();
            return body.length ? `## ChatGPT Commentary\\n\\n${body.join('\\n\\n')}` : null;
          }
          '''
          assert text.count(old_commentary) == 1
          text = text.replace(old_commentary, new_commentary, 1)

          old_segment = '''  if (commentary.length) {
              const section = renderChatGPTCommentarySegment(reasoning, commentary);
              if (section) sections.push(section);
            }
            const body = [];
            const thoughts = [];
            if (!commentary.length) for (const event of reasoning) { const text = reasoningBody(event); if (text) thoughts.push(text); }
            for (const event of tools) { const text = renderChatGPTToolEvent(event, events); if (text) thoughts.push(text); }
          '''
          new_segment = '''  if (commentary.length) {
              const section = renderChatGPTCommentarySegment(segment, events);
              if (section) sections.push(section);
            }
            const body = [];
            const thoughts = [];
            if (!commentary.length) {
              for (const event of reasoning) { const text = reasoningBody(event); if (text) thoughts.push(text); }
              for (const event of tools) { const text = renderChatGPTToolEvent(event, events); if (text) thoughts.push(text); }
            }
          '''
          assert text.count(old_segment) == 1
          text = text.replace(old_segment, new_segment, 1)
          renderer.write_text(text, encoding='utf-8')

          tests = Path('tests/chatgpt-tool-fences.test.js')
          test_text = tests.read_text(encoding='utf-8')
          assert "commentary with tool activity stays in one commentary section" not in test_text
          test_text += r'''

          test('ChatGPT commentary with tool activity stays in one commentary section', () => {
            const payload = [
              '[L339] ```unknown',
              'tool text',
              '```',
              '````',
              'nested four-backtick fence',
              '````',
              "literal marker: memcite"
            ].join('\n');
            const events = [{
              id: 'chatgpt:call-commentary',
              provider: 'chatgpt',
              source_record_id: 'call-commentary',
              source_index: 0,
              kind: 'tool_call',
              role: 'assistant',
              channel: 'commentary',
              visibility: 'visible',
              content_type: 'code',
              blocks: [{
                id: 'call-commentary:tool_call:0',
                type: 'tool_call',
                name: 'api_tool',
                input: 'inspect()',
                input_format: 'code',
                language: 'javascript',
                source: { provider: 'chatgpt', record_id: 'call-commentary', record_index: 0 }
              }],
              citations: [], display_replacements: [], resources: [], relationships: {},
              source: { provider: 'chatgpt', record_id: 'call-commentary', record_index: 0 }
            }, {
              id: 'chatgpt:result-commentary',
              provider: 'chatgpt',
              source_record_id: 'result-commentary',
              source_index: 1,
              kind: 'tool_result',
              role: 'tool',
              channel: null,
              visibility: 'visible',
              content_type: 'execution_output',
              blocks: [{
                id: 'result-commentary:tool_result:0',
                type: 'tool_result',
                name: 'api_tool',
                output: payload,
                output_format: 'execution_output',
                source: { provider: 'chatgpt', record_id: 'result-commentary', record_index: 1 }
              }],
              citations: [], display_replacements: [], resources: [], relationships: {},
              source: { provider: 'chatgpt', record_id: 'result-commentary', record_index: 1 }
            }, {
              id: 'chatgpt:commentary-2',
              provider: 'chatgpt',
              source_record_id: 'commentary-2',
              source_index: 2,
              kind: 'commentary',
              role: 'assistant',
              channel: 'commentary',
              visibility: 'visible',
              content_type: 'text',
              blocks: [{
                id: 'commentary-2:part:0',
                type: 'text',
                text: 'Continuing after the tool.',
                source: { provider: 'chatgpt', record_id: 'commentary-2', record_index: 2, part_index: 0 }
              }],
              citations: [], display_replacements: [], resources: [], relationships: {},
              source: { provider: 'chatgpt', record_id: 'commentary-2', record_index: 2 }
            }];

            const markdown = renderCanonicalMarkdown(events);
            assert.equal((markdown.match(/^## ChatGPT Commentary$/gm) ?? []).length, 1);
            assert.equal((markdown.match(/^## ChatGPT$/gm) ?? []).length, 0);
            assert.ok(markdown.includes(`<summary>api_tool output</summary>\n\n\`\`\`\`\`\n${payload}\n\`\`\`\`\``));
            assert.ok(markdown.includes('literal marker: memcite'));
            const closeFence = markdown.indexOf('`````', markdown.indexOf(payload) + payload.length);
            const commentary = markdown.indexOf('> Continuing after the tool.');
            assert.ok(closeFence >= 0 && commentary > closeFence,
              'Commentary following tool output must remain outside the adaptive fence.');
          });
          '''
          tests.write_text(test_text, encoding='utf-8')
      - name: Build and run full core preflight
        run: |
          npm run build:browser
          npm test
          python tests/validate-phase2.py
          python tests/validate-chatgpt-canonical-golden.py
          python tests/validate-claude-canonical-golden.py
          python tests/validate-codex-canonical-golden.py
      - name: Verify scoped diff
        run: |
          test -z "$(git status --short | grep -vE '^( M|\?\?) (src/projections/markdown.js|dist/aiconversationcore.chatgpt.browser.js|tests/chatgpt-tool-fences.test.js)$')"
      - name: Commit verified core fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js tests/chatgpt-tool-fences.test.js
          git commit -m "fix: keep ChatGPT tools with commentary"
          git push
