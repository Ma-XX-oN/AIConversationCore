name: CI

on:
  push:
    branches:
      - main
      - feature/canonical-presentation-html
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check production JSDoc coverage
        run: node scripts/check-jsdoc.mjs

      - name: Regenerate browser bundle on rendering branch
        if: github.event_name == 'push' && github.ref_name == 'feature/canonical-presentation-html'
        run: |
          node scripts/build-browser-bundle.mjs
          if ! git diff --quiet -- dist/aiconversationcore.chatgpt.browser.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/aiconversationcore.chatgpt.browser.js
            git commit -m "build: regenerate canonical browser bundle"
            git push origin HEAD:feature/canonical-presentation-html
          fi

      - name: Run core tests
        run: npm test

      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py

      - name: Validate canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py

      - name: Validate canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py

      - name: Validate canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py

      - name: Validate provider example regressions
        run: python tests/validate-provider-example-regressions.py
