name: Fix tool-result text/code once

on:
  push:
    paths:
      - .github/workflows/fix-tool-result-text-code-once.yml
      - scripts/fix-tool-result-text-code.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python scripts/fix-tool-result-text-code.py
      - name: Focused regression
        run: node --test tests/chatgpt-tool-language.test.js
      - name: Build browser bundle
        run: npm run build:browser
      - name: Full core tests
        run: npm test
      - name: Verify scoped diff
        run: |
          git status --short
          test -z "$(git status --short | grep -vE '^( M|\?\?) (src/adapters/chatgpt-base.js|tests/chatgpt-tool-language.test.js|dist/aiconversationcore.chatgpt.browser.js)$')"
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-base.js tests/chatgpt-tool-language.test.js dist/aiconversationcore.chatgpt.browser.js
          git commit -m "fix: classify ChatGPT text and code tool results"
          git push
