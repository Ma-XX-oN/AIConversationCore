name: Repair Phase 8 documentation and browser bundle

on:
  push:
    branches:
      - feature/agentpanelspeaker-phase8
    paths:
      - .github/workflows/update-phase8-browser-bundle.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/agentpanelspeaker-phase8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair documentation contracts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
            file_path = Path(path)
            text = file_path.read_text(encoding='utf-8')
            count = text.count(old)
            if count != 1:
              raise RuntimeError(f'{path}: expected one match, found {count}')
            file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
            'src/adapters/session.js',
            '@returns {{generated_context:string,user_text:string}} Structured queue text.',
            '@returns {Object<string, string>} Structured queue text.'
          )

          replace_once(
            'src/projections/structured.js',
            "const PRESENTATION_SCHEMA_VERSION = 1;\n"
            "const PRESENTATION_SPLIT_POLICY = 'record-anchor-except-declared-atomic-unit';\n"
            "const STRUCTURAL_UNIT_MARKER_CLASS = 'aicore-structural-unit';",
            "/** Version of the shared presentation-boundary contract. */\n"
            "const PRESENTATION_SCHEMA_VERSION = 1;\n"
            "/** Policy identifying record anchors that may be split by consumers. */\n"
            "const PRESENTATION_SPLIT_POLICY = 'record-anchor-except-declared-atomic-unit';\n"
            "/** CSS class used by invisible structural-unit declaration markers. */\n"
            "const STRUCTURAL_UNIT_MARKER_CLASS = 'aicore-structural-unit';"
          )
          replace_once(
            'src/projections/structured.js',
            '@returns {{markdown: string, units: Array<Object<string, *>>}} Annotated Markdown and declared units.',
            '@returns {Object<string, *>} Annotated Markdown and declared units.'
          )

          replace_once(
            'src/projections/markdown.js',
            "/**\n"
            " * Renders a transcript heading with optional consumer-supplied projection metadata.\n"
            " *\n"
            " * @param {Object<string, *>} event - The canonical event whose source projection metadata is being used.\n"
            " * @param {string} label - The canonical Markdown heading label before consumer decoration.\n"
            " * @returns {string} The heading with consumer-specific ANSI colour and suffix metadata applied.\n"
            " */\n"
            "function projectedHeadingMetadataSuffix(event) {",
            "/**\n"
            " * Renders the optional metadata suffix for a transcript heading.\n"
            " *\n"
            " * @param {Object<string, *>} event - The canonical event whose source projection metadata is being used.\n"
            " * @returns {string} The consumer-specific heading metadata suffix.\n"
            " */\n"
            "function projectedHeadingMetadataSuffix(event) {"
          )
          replace_once(
            'src/projections/markdown.js',
            "  const reset = colors.reset ?? '';\n"
            "  const styled = (text, colorName) => {",
            "  const reset = colors.reset ?? '';\n"
            "  /**\n"
            "   * Applies one configured ANSI colour to heading metadata.\n"
            "   *\n"
            "   * @param {string} text - Metadata text to style.\n"
            "   * @param {string} colorName - Projection colour field name.\n"
            "   * @returns {string} Styled text, or the original text when no colour is configured.\n"
            "   */\n"
            "  const styled = (text, colorName) => {"
          )
          replace_once(
            'src/projections/markdown.js',
            "function projectedHeading(event, label) {",
            "/**\n"
            " * Renders a transcript heading with optional consumer projection styling.\n"
            " *\n"
            " * @param {Object<string, *>} event - The canonical event being headed.\n"
            " * @param {string} label - Canonical Markdown heading label.\n"
            " * @returns {string} The consumer-decorated transcript heading.\n"
            " */\n"
            "function projectedHeading(event, label) {"
          )

      - name: Rebuild browser bundle
        run: npm run build:browser

      - name: Commit repaired sources and generated bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/session.js src/projections/structured.js src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js
          if git diff --cached --quiet; then
            echo 'Documentation and browser bundle already repaired.'
            exit 0
          fi
          git commit -m 'repair presentation documentation contracts'
          git push origin HEAD:feature/agentpanelspeaker-phase8
