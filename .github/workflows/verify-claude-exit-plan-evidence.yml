name: Verify Claude ExitPlanMode evidence

on:
  push:
    paths:
      - 'tests/fixtures/claude/claude-exit-plan.jsonl'
      - '.github/workflows/verify-claude-exit-plan-evidence.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch production transcript renderer
        run: |
          curl -fsSL https://raw.githubusercontent.com/Ma-XX-oN/AI-General-Memory/2910c54a4786d17de684bcffb00181b5d2c37d38/scripts/AI-transcript.py -o /tmp/AI-transcript.py
      - name: Install renderer dependencies
        run: python -m pip install colorama regex
      - name: Render Claude ExitPlanMode fixture
        run: |
          python /tmp/AI-transcript.py --claude --file tests/fixtures/claude/claude-exit-plan.jsonl --color=never > /tmp/claude-exit-plan.canonical.md
          python /tmp/AI-transcript.py --claude --file tests/fixtures/claude/claude-exit-plan.jsonl -d -n --color=always > /tmp/claude-exit-plan.decorated.md
          grep -F '### Plan' /tmp/claude-exit-plan.canonical.md
          grep -F 'User has approved your plan.' /tmp/claude-exit-plan.canonical.md
          grep -F '## User' /tmp/claude-exit-plan.canonical.md
      - uses: actions/upload-artifact@v4
        with:
          name: claude-exit-plan-regression-outputs
          path: |
            /tmp/claude-exit-plan.canonical.md
            /tmp/claude-exit-plan.decorated.md
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-claude-exit-plan-evidence.yml
          git commit -m 'chore: remove temporary Claude ExitPlanMode verification workflow'
          git push
