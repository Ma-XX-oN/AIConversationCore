name: Fix structural markup tests
on:
  push:
    branches: [feature/canonical-render-api-work]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-api-work
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/render-api.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("assert.match(markdown.content, /<details><summary>Having 3 thoughts<\\/summary>/);", "assert.match(markdown.content, /<details[^>]*><summary>Having 3 thoughts<\\/summary>/);", 1)
          text = text.replace("assert.match(html.markdown, /<details><summary>Having 3 thoughts<\\/summary>/);", "assert.match(html.markdown, /<details[^>]*><summary>Having 3 thoughts<\\/summary>/);", 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-structural-markup-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: validate attributed atomic disclosures"
          git push origin HEAD:feature/canonical-render-api-work
