name: Core test debug 2

on:
  push:
    branches:
      - feature/canonical-presentation-html

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact test output
        shell: bash
        run: |
          set +e
          npm test > core-tests.log 2>&1
          echo $? > core-tests.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: core-test-debug-2
          path: |
            core-tests.log
            core-tests.status
