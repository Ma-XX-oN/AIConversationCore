name: Apply structural unit markup contract

on:
  push:
    branches:
      - feature/canonical-render-api-work

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-render-api-work
          fetch-depth: 0
      - name: Apply structural markup patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          presentation = Path('src/projections/presentation.js')
          text = presentation.read_text(encoding='utf-8')
          text = text.replace('export const PRESENTATION_SCHEMA_VERSION = 1;', 'export const PRESENTATION_SCHEMA_VERSION = 2;', 1)
          text = text.replace('function unitId(kind, events, ordinal) {', 'export function presentationUnitId(kind, events, ordinal = 0) {', 1)
          text = text.replace('id: unitId(kind, sourceEvents, ordinal),', 'id: presentationUnitId(kind, sourceEvents, ordinal),', 1)
          text = text.replace("    boundary: options.boundary ?? 'normal',\n    label: options.label ?? null,", "    boundary: options.boundary ?? 'normal',\n    split_policy: {\n      before: true,\n      after: true,\n      inside: (options.boundary ?? 'normal') !== 'atomic'\n    },\n    label: options.label ?? null,", 1)
          presentation.write_text(text, encoding='utf-8')

          markdown = Path('src/projections/markdown.js')
          text = markdown.read_text(encoding='utf-8')
          if not text.startswith("import { presentationUnitId } from './presentation.js';"):
            text = "import { presentationUnitId } from './presentation.js';\n\n" + text
          marker = '''function projectedDetails(summary, body, sourceEvents, quoted = false, inlineOpening = false) {\n  const events = Array.isArray(sourceEvents) ? sourceEvents : [];\n'''
          replacement = '''function projectedDetails(summary, body, sourceEvents, quoted = false, inlineOpening = false) {\n  const events = Array.isArray(sourceEvents) ? sourceEvents : [];\n  const reasoningGroup = events.some(event => event?.kind === 'reasoning_summary');\n  const unitAttributes = reasoningGroup && events.length\n    ? ` data-ai-unit-id="${htmlEscape(presentationUnitId('reasoning_group', events))}" data-ai-boundary="atomic" data-ai-source-event-ids="${htmlEscape(events.map(event => event?.id ?? '').filter(Boolean).join(' '))}"`\n    : '';\n'''
          if marker not in text:
            raise SystemExit('projectedDetails marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace("  const opening = inlineOpening ? `<details>${summaryLine}` : `<details>\\n${summaryLine}`;", "  const opening = inlineOpening ? `<details${unitAttributes}>${summaryLine}` : `<details${unitAttributes}>\\n${summaryLine}`;", 1)
          text = text.replace("        thoughtEvents,\n        false,\n        true", "        run.map(item => item.event),\n        false,\n        true", 1)
          markdown.write_text(text, encoding='utf-8')

          test = Path('tests/render-api.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace("  assert.equal(reasoning.boundary, 'atomic');", "  assert.equal(reasoning.boundary, 'atomic');\n  assert.deepEqual(reasoning.split_policy, { before: true, after: true, inside: false });", 1)
          old = """  assert.match(html.content, /<details><summary>Having 3 thoughts<\\/summary>/);\n  assert.doesNotMatch(html.content, /<p>\\s*<details/);\n"""
          new = """  const reasoningUnit = html.presentation.units[0].children[0];\n  assert.match(html.content, /data-ai-boundary=\\"atomic\\"/);\n  assert.match(html.content, new RegExp(`data-ai-unit-id=\\"${reasoningUnit.id.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\"`));\n  assert.match(html.content, /data-ai-source-event-ids=\\"event-r1 event-r2 event-r3\\"/);\n  assert.match(html.content, /<summary>Having 3 thoughts<\\/summary>/);\n  assert.doesNotMatch(html.content, /<p>\\s*<details/);\n"""
          if old not in text:
            raise SystemExit('render-api grouped HTML assertion marker not found')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-structural-unit-markup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "render: carry atomic presentation units into markup"
          git push origin HEAD:feature/canonical-render-api-work
