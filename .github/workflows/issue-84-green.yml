name: Issue 84 raw HTML GREEN

on:
  push:
    branches:
      - issue-84-unmatched-raw-blockquote-regression
    paths:
      - 'scripts/issue84-apply-fix.mjs'
      - '.github/workflows/issue-84-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply issue 84 fix
        run: node scripts/issue84-apply-fix.mjs
      - name: GREEN exact permanent regression
        run: node --test tests/canonical-raw-html-structure-regression.test.js
      - name: Check production JSDoc
        run: node scripts/check-jsdoc.mjs
      - name: Regenerate deterministic browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Run complete Core suite
        run: npm test
      - name: Validate Phase 2
        run: python tests/validate-phase2-baseline.py
      - name: Validate ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Validate Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Validate Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Validate provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Verify patch integrity
        run: git diff --check
      - name: Commit verified production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/projections/html.js dist/aiconversationcore.chatgpt.browser.js
          if git diff --cached --quiet; then
            echo 'Expected production changes were not produced.' >&2
            exit 1
          fi
          git commit -m 'fix: isolate raw Markdown HTML from canonical structure (#84)'
          git push origin HEAD:issue-84-unmatched-raw-blockquote-regression
