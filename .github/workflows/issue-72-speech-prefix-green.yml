name: Issue 72 structural speech prefix GREEN

on:
  push:
    branches:
      - issue-72-speech-prefix-word-identity
    paths:
      - '.github/workflows/issue-72-speech-prefix-green.yml'
      - 'tools/issue72-speech-prefix.py'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply structural speech-prefix implementation
        run: python tools/issue72-speech-prefix.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate deterministic browser bundle
        run: npm run build:browser

      - name: Verify focused structural-prefix regression
        run: node --test tests/canonical-word-speech-prefix.test.js

      - name: Verify complete Core suite
        run: npm test

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit verified Core implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/projections/word-identity.js dist/aiconversationcore.chatgpt.browser.js
          git diff --cached --check
          git commit -m 'feat: expose ordered-list structural speech prefixes (#72)'
          git push origin HEAD:issue-72-speech-prefix-word-identity
