name: Issue 72 structural speech prefix docs

on:
  push:
    branches:
      - issue-72-speech-prefix-word-identity
    paths:
      - '.github/workflows/issue-72-speech-prefix-docs.yml'
      - 'tools/issue72-speech-prefix-docs.py'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply architecture documentation
        run: python tools/issue72-speech-prefix-docs.py

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DESIGN.md DECISIONS.md
          git diff --cached --check
          git commit -m 'docs: define structural speech prefixes (#72)'
          git push origin HEAD:issue-72-speech-prefix-word-identity
