name: Finalize commentary grouping browser bundle

on:
  push:
    branches:
      - feature/canonical-presentation-html

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-presentation-html
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate browser bundle
        run: npm run build:browser
      - name: Run full core regression suite
        run: npm test
      - name: Validate Phase 2 baseline
        run: python tests/validate-phase2-baseline.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit generated bundle and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-70-commentary-group-red.yml
          git add dist/aiconversationcore.chatgpt.browser.js
          git diff --cached --check
          git commit -m "build: refresh commentary grouping browser bundle"
          git push
