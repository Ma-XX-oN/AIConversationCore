name: AICC127 independent rebase acceptance matrix
on:
  push:
    branches:
      - verify-rebase-aicc127-20261024
permissions:
  contents: read
jobs:
  test:
    name: matrix-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: loader, command: 'npm ci && node --test tests/agent-plugin-loading.test.js test/subject-har-extraction.test.js' }
          - { label: registration, command: 'npm ci && node --test tests/plugin-registration.test.js tests/browser-structured-projection.test.js' }
          - { label: full, command: 'npm ci && node --test' }
          - { label: bundle, command: 'npm ci && npm run build:browser && node --test tests/browser-bundle.test.js' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Establish exact stable-1.1.1 ancestry
        run: git merge-base --is-ancestor 629c86284b7db5fb412bb083178eaee8c06f796c HEAD
      - name: Run ${{ matrix.label }} acceptance
        run: ${{ matrix.command }}
