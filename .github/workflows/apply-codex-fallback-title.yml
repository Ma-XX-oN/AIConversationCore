name: Apply Codex fallback title implementation

on:
  push:
    paths:
      - .github/workflows/apply-codex-fallback-title.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/adapters/codex.js')
          text = path.read_text(encoding='utf-8')
          old = '''export function resolveCodexSessionMetadata(records, sessionIndexRecords = []) {
  if (!Array.isArray(records)) throw new TypeError('Codex records must be an array.');
  if (!Array.isArray(sessionIndexRecords)) {
    throw new TypeError('Codex session-index records must be an array.');
  }

  let sessionId = null;
  for (const record of records) {
    if (record?.type === 'session_meta' && typeof record?.payload?.id === 'string' &&
        record.payload.id.trim()) {
      sessionId = record.payload.id.trim();
      break;
    }
  }

  let title = null;
  if (sessionId) {
    for (const record of sessionIndexRecords) {
      if (record?.id !== sessionId || typeof record?.thread_name !== 'string') continue;
      const candidate = record.thread_name.trim();
      if (candidate) title = candidate;
    }
  }

  return {
    session_id: sessionId,
    title,
    title_source: title ? 'codex-session-index' : 'none'
  };
}
'''
          new = '''export function resolveCodexSessionMetadata(records, sessionIndexRecords = []) {
  if (!Array.isArray(records)) throw new TypeError('Codex records must be an array.');
  if (!Array.isArray(sessionIndexRecords)) {
    throw new TypeError('Codex session-index records must be an array.');
  }

  let sessionId = null;
  for (const record of records) {
    if (record?.type === 'session_meta' && typeof record?.payload?.id === 'string' &&
        record.payload.id.trim()) {
      sessionId = record.payload.id.trim();
      break;
    }
  }

  let title = null;
  if (sessionId) {
    for (const record of sessionIndexRecords) {
      if (record?.id !== sessionId || typeof record?.thread_name !== 'string') continue;
      const candidate = record.thread_name.trim();
      if (candidate) title = candidate;
    }
  }
  if (title) {
    return {
      session_id: sessionId,
      title,
      title_source: 'codex-session-index'
    };
  }

  for (const record of records) {
    const payload = record?.type === 'event_msg' ? record?.payload : null;
    if (payload?.type !== 'user_message' || typeof payload?.message !== 'string') continue;
    let message = payload.message.replace(/\r\n/g, '\n');
    const marker = '## My request for Codex:';
    const markerIndex = message.indexOf(marker);
    if (markerIndex >= 0) message = message.slice(markerIndex + marker.length);
    const candidate = message.split('\n').map(line => line.trim()).find(Boolean) ?? '';
    if (!candidate) continue;
    return {
      session_id: sessionId,
      title: candidate,
      title_source: 'codex-user-message'
    };
  }

  return {
    session_id: sessionId,
    title: null,
    title_source: 'none'
  };
}
'''
          if text.count(old) != 1:
            raise SystemExit('resolver block did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          npm test
          git diff --check
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add src/adapters/codex.js
          git commit -m "fix: resolve Codex fallback titles in core"
          git push origin HEAD:feature/canonical-presentation-html
