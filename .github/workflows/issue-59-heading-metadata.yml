name: Apply issue 59 heading metadata

on:
  push:
    paths:
      - '.github/workflows/issue-59-heading-metadata.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch shared Markdown projection
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/projections/markdown.js')
          text = path.read_text(encoding='utf-8')
          old = '''function projectedHeading(event, label) {
            const projection = event?.projection ?? {};
            const colors = projection.colors ?? {};
            const color = label === '## User' ? colors.user : (label.includes(' Sub-agent ') ? '' : colors.ai);
            const reset = colors.reset ?? '';
            const heading = color ? `${color}${label}${reset}` : label;
            return `${heading}${projection.heading_suffix ?? ''}`;
          }
          '''
          new = '''function projectedHeadingMetadataSuffix(event) {
            const projection = event?.projection ?? {};
            const metadata = projection.heading_metadata ?? {};
            const fields = [];
            if (metadata.timestamp != null) fields.push(`[${metadata.timestamp}]:`);
            if (metadata.record_number != null) fields.push(`${metadata.record_number}:`);
            if (metadata.show_turn_id && event?.source_record_id != null) {
              fields.push(`<!-- turn_id=${event.source_record_id} -->`);
            }
            const metadataSuffix = fields.length ? ` ${fields.join(' ')}` : '';
            return `${metadataSuffix}${projection.heading_suffix ?? ''}`;
          }

          function projectedHeading(event, label) {
            const projection = event?.projection ?? {};
            const colors = projection.colors ?? {};
            const color = label === '## User' ? colors.user : (label.includes(' Sub-agent ') ? '' : colors.ai);
            const reset = colors.reset ?? '';
            const heading = color ? `${color}${label}${reset}` : label;
            return `${heading}${projectedHeadingMetadataSuffix(event)}`;
          }
          '''
          if old not in text:
            raise SystemExit('projectedHeading source block not found')
          text = text.replace(old, new, 1)
          old_thought = '''function projectedThoughtHeading(event, number) {
            const projection = event?.projection ?? {};
            const colors = projection.colors ?? {};
            const label = `### Thought ${number}`;
            const heading = colors.thought ? `${colors.thought}${label}${colors.reset ?? ''}` : label;
            return `${heading}${projection.heading_suffix ?? ''}`;
          }
          '''
          new_thought = '''function projectedThoughtHeading(event, number) {
            const projection = event?.projection ?? {};
            const colors = projection.colors ?? {};
            const label = `### Thought ${number}`;
            const heading = colors.thought ? `${colors.thought}${label}${colors.reset ?? ''}` : label;
            return `${heading}${projectedHeadingMetadataSuffix(event)}`;
          }
          '''
          if old_thought not in text:
            raise SystemExit('projectedThoughtHeading source block not found')
          text = text.replace(old_thought, new_thought, 1)
          path.write_text(text, encoding='utf-8')

          Path('tests/heading-metadata-projection.test.js').write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';

          import { renderCanonicalMarkdown } from '../src/index.js';

          function messageEvent(provider, sourceRecordId, projection = {}) {
            return {
              id: `${provider}:fixture`,
              provider,
              source_record_id: sourceRecordId,
              source_index: 1,
              kind: 'message',
              role: provider === 'chatgpt' ? 'user' : 'assistant',
              channel: null,
              visibility: 'visible',
              content_type: 'text',
              blocks: [{ type: 'text', text: 'Body' }],
              citations: [],
              resources: [],
              relationships: {},
              source: { provider, record_id: sourceRecordId, record_index: 1 },
              projection
            };
          }

          test('structured heading metadata composes timestamp, record number, and source turn id', () => {
            const event = messageEvent('chatgpt', 'chatgpt-message-id', {
              heading_metadata: {
                timestamp: '2026-08-31 15:00:00',
                record_number: 2,
                show_turn_id: true
              }
            });
            assert.match(
              renderCanonicalMarkdown([event]),
              /^## User \[2026-08-31 15:00:00\]: 2: <!-- turn_id=chatgpt-message-id -->$/m
            );
          });

          test('source turn id is omitted when the provider event has no source record id', () => {
            const event = messageEvent('codex', null, {
              heading_metadata: { show_turn_id: true }
            });
            const markdown = renderCanonicalMarkdown([event]);
            assert.match(markdown, /^## Codex$/m);
            assert.doesNotMatch(markdown, /turn_id=/);
          });

          test('legacy heading_suffix remains supported after structured metadata', () => {
            const event = messageEvent('claude', 'claude-uuid', {
              heading_metadata: { record_number: 7 },
              heading_suffix: ' LEGACY'
            });
            assert.match(renderCanonicalMarkdown([event]), /^## Claude 7: LEGACY$/m);
          });
          ''', encoding='utf-8')
      - name: Build browser bundle
        run: npm run build:browser
      - name: Run tests
        run: npm test
      - name: Commit implementation and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-59-heading-metadata.yml
          git add src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js tests/heading-metadata-projection.test.js
          git commit -m 'projection: centralize heading metadata rendering'
          git push
