name: Issue 77 refresh browser bundle

on:
  push:
    branches:
      - feature/canonical-presentation-html

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh deterministic browser bundle
        run: node scripts/build-browser-bundle.mjs

      - name: Commit generated bundle when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json dist/aiconversationcore.chatgpt.browser.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json dist/aiconversationcore.chatgpt.browser.js
          git commit -m "build: refresh browser bundle for revision visibility helpers"
          git push
