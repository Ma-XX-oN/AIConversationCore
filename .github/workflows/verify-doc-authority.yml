name: Verify canonical behaviour documentation
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation contract
        run: |
          grep -Fq 'canonical behavioural/rendering reference for every provider' DESIGN.md
          grep -Fq 'ChatGPT, Claude, and Codex' DESIGN.md
          grep -Fq 'API-driven transcript renderer' DESIGN.md
          grep -Fq 'canonical behavioural/rendering reference for every provider it recognizes' ROADMAP.md
          grep -Fq 'D011 — AI-transcript.py is the canonical multi-provider migration behaviour source' DECISIONS.md
      - name: Re-run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-doc-authority.yml
          git commit -m 'Remove temporary documentation verification workflow [skip ci]'
          git push
