name: Improve JSDoc comments once

on:
  push:
    paths:
      - .github/workflows/improve-jsdoc-comments-once.yml
      - scripts/improve-jsdoc-comments.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Improve generated JSDoc wording
        run: python scripts/improve-jsdoc-comments.py
      - name: JSDoc audit
        run: node scripts/check-jsdoc.mjs
      - name: JavaScript syntax
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Full tests
        run: node --test tests/*.test.js
      - name: Verify documentation-only diff
        run: |
          git diff --check
          git status --short
      - name: Commit verified wording cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/check-jsdoc.mjs dist/aiconversationcore.chatgpt.browser.js
          git commit -m "docs: improve production function comments"
          git push
