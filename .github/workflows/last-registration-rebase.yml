name: Rebuild and verify AICC Last integration
on:
  push:
    branches:
      - issue-132-last-registration-rebase-20261024
    paths:
      - 'src/**'
      - 'scripts/build-browser-bundle-plugins.mjs'
      - 'tests/last-registration-activity-rebase.test.js'
      - '.github/workflows/last-registration-rebase.yml'
permissions:
  contents: write
jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:browser
      - run: node --test tests/retained-activity.test.js tests/last-registration-activity-rebase.test.js tests/plugin-registration.test.js tests/browser-bundle.test.js
      - name: Commit generated artifact to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/aiconversationcore.chatgpt.browser.js
          if ! git diff --cached --quiet; then
            git commit -m "build(#132): regenerate registered Last Core browser artifact"
            git push origin HEAD:issue-132-last-registration-rebase-20261024
          fi
