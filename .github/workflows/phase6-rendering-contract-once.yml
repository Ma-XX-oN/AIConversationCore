name: Apply Phase 6 rendering contract once

on:
  push:
    paths:
      - .github/workflows/phase6-rendering-contract-once.yml
      - scripts/fix-phase6-subagent-related-source.py
      - scripts/fix-phase6-subagent-heading-source.py
      - tests/phase6-subagent-provenance.test.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply subagent dual-provenance support
        run: |
          python scripts/fix-phase6-subagent-related-source.py
          python scripts/fix-phase6-subagent-heading-source.py
      - name: Rebuild deterministic browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified subagent dual provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/claude.js src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js tests/claude-adapter.test.js
          git commit -m "phase6: preserve subagent invocation and completion provenance"
          git push
