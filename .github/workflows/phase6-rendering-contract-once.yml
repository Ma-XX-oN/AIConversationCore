name: Finalize Phase 6 core integration

on:
  push:
    paths:
      - .github/workflows/phase6-rendering-contract-once.yml
      - scripts/finalize-phase6-integration.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Record Phase 6 decisions and completion
        run: python scripts/finalize-phase6-integration.py
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Remove temporary Phase 6 scaffolding
        run: |
          git rm -f --ignore-unmatch scripts/*phase6*.py scripts/*phase6*.mjs
          git rm -f --ignore-unmatch .github/workflows/phase6-*.yml
      - name: Diff hygiene
        run: git diff --check
      - name: Commit final Phase 6 core state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md tests/known-differences.json
          git commit -m "phase6: finalize canonical integration"
          git push
