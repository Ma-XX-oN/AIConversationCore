name: Apply Phase 6 rendering contract once

on:
  push:
    paths:
      - .github/workflows/phase6-rendering-contract-once.yml
      - scripts/apply-phase6-rendering-contract.py
      - scripts/fix-phase6-rendering-details.py
      - scripts/fix-phase6-rendering-scope.py
      - scripts/fix-phase6-chatgpt-thought-count.py
      - scripts/finalize-phase6-rendering-contract.py
      - tests/phase6-rendering-contract.test.js
      - tests/chatgpt-tool-fences.test.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical rendering contract
        run: |
          python scripts/apply-phase6-rendering-contract.py
          python scripts/fix-phase6-rendering-details.py
          python scripts/fix-phase6-rendering-scope.py
          python scripts/fix-phase6-chatgpt-thought-count.py
      - name: Regenerate intentional ChatGPT golden
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { adaptChatGPTRecords, renderCanonicalMarkdown } from './src/index.js';
          const source = fs.readFileSync('tests/fixtures/chatgpt/chatgpt-direct.jsonl', 'utf8');
          const records = source.split(/\r?\n/).filter(line => line.trim()).map(line => JSON.parse(line));
          const markdown = renderCanonicalMarkdown(adaptChatGPTRecords(records));
          fs.writeFileSync('tests/golden/chatgpt/chatgpt-direct.canonical.md', markdown, 'utf8');
          NODE
          python scripts/finalize-phase6-rendering-contract.py
      - name: Rebuild deterministic browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified rendering contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js tests/golden/chatgpt/chatgpt-direct.canonical.md tests/canonical-golden-manifest.json DECISIONS.md NORMALIZATION_RULES.md
          git commit -m "phase6: enforce canonical rendering provenance contract"
          git push
