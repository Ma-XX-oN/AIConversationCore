name: Codex source contract validation

on:
  push:
    paths:
      - .github/workflows/codex-source-contract-red.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check production JSDoc coverage
        run: node scripts/check-jsdoc.mjs
      - name: Run core tests
        run: npm test
      - name: Build browser bundle
        run: npm run build:browser
      - name: Verify browser bundle unchanged by Node-only source API
        run: git diff --exit-code -- dist/aiconversationcore.chatgpt.browser.js
      - name: Run Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Validate canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Validate canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Validate canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Validate provider example regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      # Temporary branch validation gate; remove after the full run is green.
