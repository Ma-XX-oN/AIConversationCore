name: Apply issue 86 response heading metadata

on:
  push:
    branches:
      - issue-86-response-heading-metadata
    paths:
      - '.github/workflows/issue86-response-heading-metadata.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/issue86-response-heading-metadata.py
      - name: Build browser bundle
        run: npm run build:browser
      - name: Run complete Core suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue86-response-heading-metadata.yml scripts/issue86-response-heading-metadata.py
          git add src/projections/markdown.js dist/aiconversationcore.chatgpt.browser.js tests/phase6-rendering-contract.test.js
          git commit -m 'projection: support structured response heading metadata (#86)'
          git push
