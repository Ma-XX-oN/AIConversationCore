name: Fix semantic JSDoc contracts once

on:
  push:
    paths:
      - .github/workflows/fix-jsdoc-semantics-once.yml
      - scripts/fix-jsdoc-semantics-once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Correct semantic JSDoc contracts
        run: python scripts/fix-jsdoc-semantics-once.py
      - name: Rebuild browser bundle
        run: node scripts/build-browser-bundle.mjs
      - name: Documentation contract
        run: node scripts/check-jsdoc.mjs
      - name: Reject void contracts with value returns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          for p in [*Path('src').rglob('*.js'), *Path('scripts').rglob('*.mjs')]:
            if p.name == 'check-jsdoc.mjs': continue
            s=p.read_text()
            pat=re.compile(r'/\*\*[\s\S]*?@returns\s+\{void\}[\s\S]*?\*/\s*(?:export\s+)?(?:async\s+)?function\s+(\w+)\s*\([^)]*\)\s*\{')
            for m in pat.finditer(s):
              i=m.end(); depth=1; quote=None; esc=False
              while i < len(s) and depth:
                c=s[i]
                if quote:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==quote: quote=None
                else:
                  if c in "'\"`": quote=c
                  elif c=='{': depth+=1
                  elif c=='}': depth-=1
                i+=1
              body=s[m.end():i-1]
              if re.search(r'\breturn\s+(?!;)', body): failures.append(f'{p}:{m.group(1)}')
          if failures:
            raise SystemExit('void contracts with value returns:\n'+'\n'.join(failures))
          print('No named function documented void returns a value.')
          PY
      - name: Core tests
        run: npm test
      - name: Phase 2 integrity gate
        run: python tests/validate-phase2-baseline.py
      - name: Canonical ChatGPT golden
        run: python tests/validate-canonical-golden.py
      - name: Canonical Claude golden
        run: python tests/validate-claude-canonical-golden.py
      - name: Canonical Codex golden
        run: python tests/validate-codex-canonical-golden.py
      - name: Provider regressions
        run: python tests/validate-provider-example-regressions.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src dist/aiconversationcore.chatgpt.browser.js
          git commit -m "docs: correct core JSDoc semantics"
          git push
